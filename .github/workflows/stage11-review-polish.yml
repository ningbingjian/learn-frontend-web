name: Stage 11 Review Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage11-review-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Polish review ownership and Markdown layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base = Path('learn-frontend-web-course/stage11-react')
          stage = base / 'README.md'
          m22 = base / 'module11-22-a11y-security-debugging/README.md'
          m24 = base / 'module11-24-ssr-hydration-streaming/README.md'
          m25 = base / 'module11-25-rsc-server-functions-data/README.md'

          def read(p): return p.read_text(encoding='utf-8')
          def write(p,s): p.write_text(s,encoding='utf-8')

          def replace_once(p, old, new):
              s=read(p)
              if old not in s:
                  raise SystemExit(f'missing text in {p}: {old[:100]}')
              write(p,s.replace(old,new,1))

          def pop_lesson(p, lesson_id):
              s=read(p)
              anchor=f'<a id="lesson-{lesson_id.lower()}"></a>'
              pat=re.compile(rf'(?ms)^({re.escape(anchor)}\n### Lesson {re.escape(lesson_id)}：.*?)(?=^<a id="lesson-|^---\n|\Z)')
              m=pat.search(s)
              if not m: raise SystemExit(f'lesson not found: {lesson_id}')
              block=m.group(1).rstrip()+'\n\n'
              write(p,s[:m.start()]+s[m.end():])
              return block

          def insert_before_text(p, marker, block):
              s=read(p)
              pos=s.find(marker)
              if pos<0: raise SystemExit(f'marker missing in {p}: {marker[:80]}')
              write(p,s[:pos].rstrip()+'\n\n'+block+s[pos:])

          # M22: its sub-section introductions must match the reduced pre-SSR/RSC scope.
          replace_once(m22,
              '本 Module 聚焦 React 渲染、HTML、URL、Markdown、SSR/Hydration、RSC、Server Function 与权限 UI 的安全边界。',
              '这一组 Lesson 聚焦截至当前位置已经正式学过的 React 渲染、HTML/URL/Markdown Sink、Client Permission UI、Server Mutation Trust Boundary 与敏感数据暴露；SSR/Hydration 专项安全已移到 Module 11.24，RSC/Server Function 专项安全在 Module 11.25 落地。')
          replace_once(m22,
              '本 Module 不重复教授每个 Bug 的机制，而是建立跨 React 问题的系统诊断方法：症状分类、最小复现、DevTools、Profiler、Network、Heap、Source Map、Release/Trace 关联。',
              '这一组 Lesson 不重复教授每个 Bug 的机制，而是建立截至当前知识范围内的 React 系统诊断方法：症状分类、最小复现、DevTools、Profiler、Network、Heap、Source Map、Release/Trace 关联；Hydration/RSC 专项诊断在对应 Owner Module 学完后再扩展。')
          replace_once(m22,
              '区分错误 UI、状态错位、重复 Render、卡顿、泄漏、异步乱序、Hydration、Chunk/Network。',
              '先区分错误 UI、状态错位、重复 Render、卡顿、泄漏、异步乱序、Chunk/Network；Hydration 与 RSC/Server Runtime 故障分别在 Module 11.24 / 11.25 学完后加入诊断分类。')
          replace_once(m22,
              '结合键盘、axe 类工具和手工 screen-reader-friendly 检查记录问题。',
              '结合键盘、课程提供的 axe 扫描脚本和手工 screen-reader-friendly 检查记录问题；本课关注 React-specific A11Y 证据，不教授测试工具链。')

          # M24: put moved lessons under the correct conceptual segment, not after the next segment intro.
          sec008 = pop_lesson(m24,'RE-SEC-008')
          sec009 = pop_lesson(m24,'RE-SEC-009')
          dbg008 = pop_lesson(m24,'RE-DEBUG-008')
          test013 = pop_lesson(m24,'RE-TEST-013')

          insert_before_text(m24,
              '\n---\n\n本 Module 完整学习 hydrateRoot、HTML Identity、Event、Mismatch、Date/Random/Locale、useId、Browser Extension/DOM Mutation、Recoverable Error 和性能。',
              sec008)
          moved_hydration = sec009 + dbg008 + test013
          insert_before_text(m24,
              '\n---\n\n本 Module 学习 React 如何利用 Suspense Boundary 把 Server HTML 分段输出，并覆盖 Shell、Chunk、Backpressure、Abort、Proxy Buffering、Crawler 和失败恢复。',
              moved_hydration)

          # M25: explicit harness wording for bundle/module-graph observations.
          replace_once(m25,
              '把 server-only dependency 留在服务器，并用 bundle report 验证。',
              '把 server-only dependency 留在服务器，并使用课程 Harness 已生成的 bundle report 验证 Client Bundle 是否减少；Bundler 分析机制本身留到 Stage 16。')
          replace_once(m25,
              '移动 directive 并比较依赖图。',
              '移动 directive，并使用课程 Harness 提供的 module graph / bundle diff 比较边界变化；当前只解释 React Boundary 结果，不教授 Bundler 图生成机制。')

          # Normalize Markdown spacing for all Module READMEs after batch edits/moves.
          modules = sorted(base.glob('module11-*/README.md'))
          if len(modules) != 35:
              raise SystemExit(f'expected 35 modules, got {len(modules)}')

          total = 0
          all_ids=[]
          for i,p in enumerate(modules):
              s=read(p)
              # Ensure a blank line before every lesson anchor.
              s=re.sub(r'(?<!\n)\n(<a id="lesson-[^"]+"></a>)',r'\n\n\1',s)
              # Ensure exactly one blank line between a lesson anchor and previous paragraph even after moved blocks.
              s=re.sub(r'\n{3,}(<a id="lesson-[^"]+"></a>)',r'\n\n\1',s)
              # Remove duplicate horizontal rules created by prior split/move operations.
              while re.search(r'\n---\n\s*---\n',s):
                  s=re.sub(r'\n---\n\s*---\n',r'\n---\n',s,count=1)

              # Rebuild lesson nav from physical lesson order.
              s=re.sub(r'\n?<!-- LESSON_NAV:START -->.*?<!-- LESSON_NAV:END -->\n?','\n',s,count=1,flags=re.S)
              lines=s.splitlines()
              title=lines[0]
              body='\n'.join(lines[1:]).lstrip('\n')
              body=re.sub(r'^> .*?\n\n','',body,count=1)
              body=re.sub(r'\n---\n\n> .*?\n?\Z','',body,count=1,flags=re.S).rstrip()
              pat=re.compile(r'^<a id="lesson-([a-z0-9-]+)"></a>\n### Lesson ([A-Za-z0-9-]+)：(.+)$',re.M)
              lessons=list(pat.finditer(body))
              if not lessons: raise SystemExit(f'no lessons: {p}')
              total+=len(lessons); all_ids.extend(m.group(2) for m in lessons)
              nav=['<!-- LESSON_NAV:START -->','<details>',f'<summary><strong>Lesson 导航（{len(lessons)} 课）</strong></summary>','']
              for m in lessons:
                  nav.append(f'- [{m.group(2)}：{m.group(3)}](#lesson-{m.group(2).lower()})')
              nav += ['', '</details>', '<!-- LESSON_NAV:END -->']
              first=lessons[0].start(); before=body[:first].rstrip(); after=body[first:].lstrip()
              prev_title=read(modules[i-1]).splitlines()[0].removeprefix('# ') if i>0 else None
              next_title=read(modules[i+1]).splitlines()[0].removeprefix('# ') if i+1<len(modules) else None
              links=[]
              if i>0: links.append(f'[← {prev_title}](../{modules[i-1].parent.name}/README.md)')
              links.append('[↑ Stage 11 总纲](../README.md)')
              if i+1<len(modules): links.append(f'[{next_title} →](../{modules[i+1].parent.name}/README.md)')
              crumb='> '+' · '.join(links)
              write(p,title+'\n\n'+crumb+'\n\n'+before+'\n\n'+'\n'.join(nav)+'\n\n'+after+'\n\n---\n\n'+crumb+'\n')

          if total != 1101: raise SystemExit(f'lesson count changed: {total}')
          if len(all_ids) != len(set(all_ids)): raise SystemExit('duplicate lesson IDs')

          # Update Stage version/review note and regenerate counts after final physical ordering.
          st=read(stage).replace('> 版本：v2.4-draft','> 版本：v2.5-draft',1)
          st=st.replace(
              '> **全局复审基线（2026-09-02 / v2.4）**：已完成第一轮 Dependency / Duplication / Granularity / Knowledge Ceiling Review。明确修正了 78→35 收敛后遗留的旧 Module 引用；将 SSR/Hydration 专项安全、Debug、Test 移回 SSR Owner；将 RSC 选择矩阵移到 RSC 学完之后；把 External Store PoC 移到 useSyncExternalStore 正式学习之后；并为 Node/Bundler/DB/Module Federation/E2E/Codemod 等未来 Stage 能力补充 Teaching Infrastructure Boundary。Lesson 知识内容未减少。',
              '> **全局复审基线（2026-09-02 / v2.5）**：已完成 Dependency / Duplication / Granularity / Knowledge Ceiling 两轮复审与落位校验。修正了 78→35 收敛后的旧 Module 引用；将 External Store PoC、SSR/Hydration Security/Debug/Test、RSC 选择矩阵移动到知识正式学习之后；明确 Node/Bundler/DB/Module Federation/E2E/Codemod 等未来 Stage 能力只能作为 Teaching Infrastructure；并完成移动后段落归属、导航与 Markdown 可读性收尾。1101 个 Lesson 全部保留。',1)
          rows=['| Module | 主题 | Lesson 数 |','| --- | --- | ---: |']
          for p in modules:
              t=read(p); head=t.splitlines()[0].removeprefix('# Module '); num,topic=head.split('：',1)
              c=len(re.findall(r'^### Lesson ',t,flags=re.M))
              rows.append(f'| [{num}](./{p.parent.name}/README.md) | [{topic}](./{p.parent.name}/README.md) | {c} |')
          st=re.sub(r'\| Module \| 主题 \| Lesson 数 \|\n\| --- \| --- \| ---: \|.*?(?=\n\n---)','\n'.join(rows),st,count=1,flags=re.S)
          write(stage,st)

          # Final ownership assertions.
          t22=read(m22); t24=read(m24); t25=read(m25)
          assert 'SSR/Hydration、RSC、Server Function 与权限 UI' not in t22
          assert t24.index('RE-SEC-008') < t24.index('本 Module 完整学习 hydrateRoot')
          assert t24.index('RE-HYDRATE-014') < t24.index('RE-SEC-009') < t24.index('本 Module 学习 React 如何利用 Suspense Boundary')
          assert t24.index('RE-TEST-013') < t24.index('本 Module 学习 React 如何利用 Suspense Boundary')
          assert 'bundle report 验证' not in t25 or '课程 Harness 已生成的 bundle report' in t25
          print('polish verified modules=35 lessons=1101 unique_ids=1101')
          PY

      - name: Commit polish and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stage11-review-polish.yml
          git add learn-frontend-web-course/stage11-react
          git commit -m 'polish React Stage 11 review ownership and layout'
          git push origin HEAD:main
