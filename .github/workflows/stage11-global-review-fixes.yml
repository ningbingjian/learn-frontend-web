          update_lesson(paths[31],'RE-LIB-007',new_desc='使用课程提供的 bundle inspection 脚本验证 side effect、barrel 和重复 React 是否影响消费产物；Tree Shaking 算法与 Bundler 深度统一留到 Stage 16。')
