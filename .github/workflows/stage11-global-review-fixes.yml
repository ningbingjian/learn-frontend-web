          # 9) Rebuild all module lesson navigation and prev/next links after moves/title changes.
          modules=sorted(base.glob('module11-*/README.md'))
          if len(modules)!=35: raise SystemExit(f'expected 35 modules, got {len(modules)}')
          ids=[]
          total=0
          for i,p in enumerate(modules):
              text=read(p)
              lines=text.splitlines()
              title=lines[0]
              # remove current generated lesson nav
              text=re.sub(r'\n?<!-- LESSON_NAV:START -->.*?<!-- LESSON_NAV:END -->\n?','\n',text,count=1,flags=re.S)
              # current breadcrumb/footer will be rebuilt
              body='\n'.join(text.splitlines()[1:]).lstrip('\n')
              body=re.sub(r'^> .*?\n\n','',body,count=1)
              body=re.sub(r'\n---\n\n> .*?\n?\Z','',body,count=1,flags=re.S).rstrip()
              lesson_pat=re.compile(r'^<a id="lesson-([a-z0-9-]+)"></a>\n### Lesson ([A-Za-z0-9-]+)：(.+)$',re.M)
              found=list(lesson_pat.finditer(body))
              if not found: raise SystemExit(f'no lessons: {p}')
              total+=len(found)
              for m in found: ids.append(m.group(2))
              nav=['<!-- LESSON_NAV:START -->','<details>',f'<summary><strong>Lesson 导航（{len(found)} 课）</strong></summary>','']
              for m in found:
                  lid=m.group(2); lt=m.group(3); nav.append(f'- [{lid}：{lt}](#lesson-{lid.lower()})')
              nav += ['', '</details>', '<!-- LESSON_NAV:END -->']
              first=found[0].start()
              before=body[:first].rstrip(); after=body[first:].lstrip()
              prev_title=read(modules[i-1]).splitlines()[0].removeprefix('# ') if i>0 else None
              next_title=read(modules[i+1]).splitlines()[0].removeprefix('# ') if i+1<len(modules) else None
              links=[]
              if i>0: links.append(f'[← {prev_title}](../{modules[i-1].parent.name}/README.md)')
              links.append('[↑ Stage 11 总纲](../README.md)')
              if i+1<len(modules): links.append(f'[{next_title} →](../{modules[i+1].parent.name}/README.md)')
              crumb='> '+' · '.join(links)
              new=title+'\n\n'+crumb+'\n\n'+before+'\n\n'+'\n'.join(nav)+'\n\n'+after+'\n\n---\n\n'+crumb+'\n'
              write(p,new)

          if total!=1101: raise SystemExit(f'lesson total changed unexpectedly: {total}')
