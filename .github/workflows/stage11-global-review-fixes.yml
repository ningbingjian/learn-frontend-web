          stale_checks=[
              '完整机制留到 Module 11.13',
              '完整处理留到 11.14',
              '完整 State Modeling 留到 11.14',
              '完整 Query 模型留到 11.29',
              '详细结构留 11.66',
              '把 11.13 的行为模型',
              '连接 11.13 的 State Preservation',
          ]
