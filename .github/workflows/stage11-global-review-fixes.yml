          marker='> Stage 11 的详细 Lesson 已按 Module 拆分到独立目录。这里仅保留学习总览；点击 Module 名称进入该 Module 的完整 Lesson 大纲。\n'
          if review_note.strip() not in st:
              st=st.replace(marker,marker+review_note,1)
          write(stage,st)

          # 11) Semantic regression checks for the issues this pass is supposed to eliminate.
