name: Stage 11 Global Review Fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage11-global-review-fixes.yml'

permissions:
  contents: write

jobs:
  review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply dependency, duplication and knowledge-ceiling fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base = Path('learn-frontend-web-course/stage11-react')
          stage = base / 'README.md'
          paths = {
            4: base/'module11-04-conditional-list-key-identity/README.md',
            6: base/'module11-06-state-snapshot-queue-batching/README.md',
            7: base/'module11-07-immutable-state-identity/README.md',
            8: base/'module11-08-state-modeling-ownership/README.md',
            9: base/'module11-09-form/README.md',
            10: base/'module11-10-reducer-context-state-architecture/README.md',
            11: base/'module11-11-ref-imperative/README.md',
            12: base/'module11-12-effect-external-sync/README.md',
            13: base/'module11-13-custom-hook-external-store/README.md',
            14: base/'module11-14-router-route-data/README.md',
            15: base/'module11-15-server-state-query-api/README.md',
            16: base/'module11-16-actions-optimistic/README.md',
            17: base/'module11-17-concurrent-suspense-activity/README.md',
            18: base/'module11-18-performance-compiler/README.md',
            21: base/'module11-21-error-model/README.md',
            22: base/'module11-22-a11y-security-debugging/README.md',
            23: base/'module11-23-testing/README.md',
            24: base/'module11-24-ssr-hydration-streaming/README.md',
            25: base/'module11-25-rsc-server-functions-data/README.md',
            26: base/'module11-26-source-fiber/README.md',
            27: base/'module11-27-reconciler-render-commit/README.md',
            30: base/'module11-30-server-renderer-hydration-rsc-internals/README.md',
            31: base/'module11-31-library-headless/README.md',
            32: base/'module11-32-large-scale-microfrontend/README.md',
            33: base/'module11-33-legacy-migration/README.md',
            34: base/'module11-34-upgrade-governance/README.md',
            35: base/'module11-35-architecture-final/README.md',
          }

          def read(p): return p.read_text(encoding='utf-8')
          def write(p,s): p.write_text(s,encoding='utf-8')

          def replace_once(p, old, new):
              s=read(p)
              if old not in s:
                  raise SystemExit(f'missing replacement in {p}: {old[:100]}')
              write(p, s.replace(old,new,1))

          def update_lesson(p, lesson_id, new_title=None, new_desc=None):
              s=read(p)
              anchor=f'<a id="lesson-{lesson_id.lower()}"></a>'
              pat=re.compile(rf'(?ms)^({re.escape(anchor)}\n### Lesson {re.escape(lesson_id)}：)([^\n]+)\n\n(.*?)(?=\n<a id="lesson-|\n---\n\n> |\Z)')
              m=pat.search(s)
              if not m:
                  raise SystemExit(f'lesson not found {lesson_id} in {p}')
              body=m.group(3)
              parts=body.split('\n\n',1)
              first=parts[0]
              tail=('\n\n'+parts[1]) if len(parts)>1 else ''
              title=new_title if new_title is not None else m.group(2)
              desc=new_desc if new_desc is not None else first
              repl=m.group(1)+title+'\n\n'+desc+tail
              write(p, s[:m.start()]+repl+s[m.end():])

          def pop_lesson(p, lesson_id):
              s=read(p)
              anchor=f'<a id="lesson-{lesson_id.lower()}"></a>'
              pat=re.compile(rf'(?ms)^({re.escape(anchor)}\n### Lesson {re.escape(lesson_id)}：.*?)(?=^<a id="lesson-|^---\n\n> |\Z)')
              m=pat.search(s)
              if not m:
                  raise SystemExit(f'cannot move {lesson_id} from {p}')
              block=m.group(1).rstrip()+'\n\n'
              write(p, s[:m.start()]+s[m.end():])
              return block

          def insert_before_lesson(p, before_id, block):
              s=read(p)
              anchor=f'<a id="lesson-{before_id.lower()}"></a>'
              pos=s.find(anchor)
              if pos<0: raise SystemExit(f'target {before_id} missing in {p}')
              write(p, s[:pos]+block+s[pos:])

          def insert_before_footer(p, block):
              s=read(p)
              marker='\n---\n\n> '
              pos=s.rfind(marker)
              if pos<0: raise SystemExit(f'footer missing in {p}')
              write(p, s[:pos].rstrip()+'\n\n'+block+s[pos:])

          # 1) Fix stale module references left by the 78 -> 35 consolidation.
          replace_once(paths[6],
              '本 Module 负责建立 React State 的基本存储与更新模型：为什么普通变量不够、State 属于谁、`useState` 返回什么、Setter 为什么不是赋值、初始化与重置如何工作。复杂队列/Batching 在下一 Module，Object/Array 不可变更新在 11.12 深入。',
              '本 Module 一次建立 React State 的基本存储与更新时间模型：为什么普通变量不够、State 属于谁、`useState` 返回什么、Setter 为什么不是赋值，以及 Snapshot、Update Queue 与 Batching 如何解释更新结果。Object/Array 不可变更新与 Component Identity 在下一 Module 11.07 继续。')
          update_lesson(paths[4],'RE-LIST-010',new_desc='把 Key 放到组件级切换场景，先建立“type + position + key”决定 identity 的直觉；Component Identity / State Preservation 的完整行为模型在 Module 11.07，Reconciler 源码验证在 Module 11.27。')
          update_lesson(paths[6],'RE-STATE-011',new_desc='复现“从 Props 初始化 State 后 Props 更新但 State 不跟着变”的常见 Bug，引出 Derived / Duplicate State；完整 State Modeling 与 Ownership 在 Module 11.08。')
          update_lesson(paths[7],'RE-IMMUTABLE-014',new_desc='观察深层嵌套数据更新，提出 flatten / normalize 的问题；完整 State Modeling 在 Module 11.08。')
          update_lesson(paths[7],'RE-IDENTITY-006',new_desc='连接 Module 11.03 已学的 Nested Component Definition，从 Component Type 每次变新的角度完整解释 State 重置。')
          update_lesson(paths[8],'RE-MODELING-013',new_desc='只建立远程所有权、缓存、Stale、Refetch 的概念，完整 Server State / Query 模型留到 Module 11.15。')
          update_lesson(paths[17],'RE-ACTIVITY-004',new_desc='连接 Module 11.07 的 Component Identity / State Preservation 行为模型。')
          update_lesson(paths[26],'RE-FIBER-015',new_desc='连接 memoizedState 到 Hook linked list；Hook 链与 Dispatcher 的完整源码结构留到 Module 11.28。')
          update_lesson(paths[27],'RE-RECON-014',new_desc='把 Module 11.07 的 Component Identity / State Preservation 行为模型对应到 Fiber reuse/reset。')

          # 2) Clarify owner boundaries instead of re-teaching the same topic twice.
          update_lesson(paths[9],'RE-FORM-004',new_title='Form 场景下 Controlled / Uncontrolled Input 应该怎么选',new_desc='只从表单输入语义比较即时联动、Validation、字段规模、第三方控件和原生 Form 能力；通用 Component State Ownership 已在 Module 11.08 学过，这里不重复。')
          update_lesson(paths[10],'RE-CONTEXT-013',new_title='如何让依赖 Context 的组件保持可测试性',new_desc='通过缩小 Provider Boundary、显式 dependency 和可替换默认依赖设计可验证组件；真正的 Provider wrapper / React 自动化测试实现统一留到 Module 11.23。')
          update_lesson(paths[10],'RE-STATEARCH-007',new_title='什么时候架构上需要 External Store，而不是继续扩 Context / Reducer',new_desc='只从外部所有权、React 外读写、订阅粒度和团队边界判断是否需要 External Store；subscribe/getSnapshot/useSyncExternalStore 契约由 Module 11.13 正式教授。')

          # Preserve the External Store PoC, but move its implementation after the store contract is actually taught.
          block=pop_lesson(paths[10],'RE-STATEARCH-023')
          insert_before_footer(paths[13],block)
          update_lesson(paths[13],'RE-STATEARCH-023',new_title='延伸项目——实现 External Store PoC 并与 Context + Reducer 比较',new_desc='在已经学完 useSyncExternalStore 与最小 External Store Contract 后，为 Multi-step Workflow 实现同一核心场景的 External Store PoC，并比较订阅粒度、Debug、代码复杂度和迁移成本。')

          # 3) Keep pre-testing modules focused on testability/verification, not testing-tool instruction.
          update_lesson(paths[7],'RE-IMMUTABLE-015',new_desc='在订单数据中完成增删改、批量标记、排序与撤销前置数据结构；使用课程提供的最小断言脚本验证旧对象未被污染，本课不要求学习 React 测试框架。')
          update_lesson(paths[9],'RE-FORM-028',new_desc='运行课程提供的验收脚本，并手工验证键盘、IME、Validation 与 production build；输出 Component Tree、State Ownership Map 和已知限制。React 自动化测试统一在 Module 11.23。')
          update_lesson(paths[10],'RE-REDUCER-009',new_title='用最小断言验证 Reducer 为什么特别有价值',new_desc='不渲染 React，使用课程提供的最小断言脚本对 action sequence 验证 state transition，建立“纯业务转换可独立验证”的能力；测试框架本身不是本课知识。')
          update_lesson(paths[10],'RE-REDUCER-014',new_desc='保留 UI 行为不变，把多处业务 Setter 收敛为 Action / Reducer，并继续使用本 Module 的最小断言脚本证明 state transition 行为一致。')
          update_lesson(paths[11],'RE-IMP-010',new_title='Imperative Component 应该暴露什么可验证合同',new_desc='从用户可观察行为与必要 Handle 两个层面定义合同，避免把内部 DOM/State 变成公共测试接口；自动化测试写法留到 Module 11.23。')
          update_lesson(paths[12],'RE-EFFECTEVENT-007',new_title='如何验证 Effect Event 没有破坏订阅生命周期',new_desc='通过订阅次数、重连次数和回调读取值的运行日志验证语义；自动化 React 测试写法统一留到 Module 11.23。')
          update_lesson(paths[13],'RE-HOOK-010',new_title='Custom Hook 如何设计成可验证的行为合同',new_desc='优先定义消费组件可观察行为、输入/输出和错误边界；独立 Hook harness 与自动化测试方法留到 Module 11.23。')
          update_lesson(paths[15],'RE-API-013',new_title='Mock API / Contract Verification 如何服务 React 开发',new_desc='使用课程提供的 Mock Server 与 schema 样例验证正常/错误响应合同，让前端在后端不稳定时仍能工作；Mock/Test 工具工程化统一留到 Module 11.23 与后续质量 Stage。')
          update_lesson(paths[18],'RE-PERF-015',new_desc='为 memo/cache/virtualization 保留已有行为验收，并定义 React-specific 性能回归阈值；自动化测试工具在 Module 11.23，完整 Performance Governance 在后续性能 Stage。')
          update_lesson(paths[18],'RE-MEMO-006',new_desc='制造 stale memo / stale callback，通过 Linter、运行结果和既有行为验收发现依赖错误；不在本课提前教授测试工具。')
          update_lesson(paths[22],'RE-A11Y-008',new_title='Keyboard-first Component 如何做手工交互验证',new_desc='对 menu/dialog/listbox 等复合交互逐项验证 Tab/Arrow/Escape 和 Focus；自动化 user-event 测试在 Module 11.23。')
          update_lesson(paths[22],'RE-DEBUG-013',new_desc='为每类问题先定义应保留的回归证据；React 自动化验证从 Module 11.23 开始，Unit/Integration/E2E/Visual 等完整质量工程留到后续 Testing Stage。')

          # 4) Stop Effect/Store/Concurrency lessons from stealing later owner APIs.
          update_lesson(paths[12],'RE-EFFECT-017',new_title='Function Dependency 为什么经常不停变化，优先应该怎么修',new_desc='比较移动逻辑、Effect 内定义函数、缩小 Reactive Input 等结构性修复；函数 Memoization 只作为后续选项提示，useCallback 在 Module 11.18 正式学习。')
          update_lesson(paths[12],'RE-REMOVE-007',new_title='外部 Store Subscription 为什么应该交给专用 Store Hook',new_desc='这里只识别“外部可变数据源 + subscribe”不是普通 Effect 同步问题，并把实现责任交给下一 Module 11.13；useSyncExternalStore 的 tearing / SSR / snapshot contract 不在本课展开。')
          update_lesson(paths[12],'RE-REMOVE-010',new_title='昂贵纯计算为什么不应该用 Effect + State',new_desc='先把纯计算放回 Render 数据流，消除 Effect + State 的二次同步；是否需要缓存以及 useMemo 的成本模型统一留到 Module 11.18。')
          update_lesson(paths[12],'RE-LAYOUT-009',new_desc='用课程给定的简单 timing / browser recording 步骤观察同步工作阻塞 Paint，并完成结构重构；Profiler 与 Performance Trace 的系统分析在 Module 11.18。')
          update_lesson(paths[12],'RE-LAYOUT-010',new_desc='结合 Ref、LayoutEffect 与课程提供的 ResizeObserver helper 完成无闪烁定位；本课先不要求 Portal，DOM 跨层挂载在 Module 11.19 正式加入。')

          replace_once(paths[13],
              '本 Module 从逻辑复用进入 Hook API、生命周期、依赖、SSR、测试、Debug 和 Library 设计，避免“看到三行重复就抽 Hook”。',
              '本 Module 从逻辑复用进入 Hook API、生命周期、依赖、Browser Boundary、可验证性、Debug 与 External Store Contract，避免“看到三行重复就抽 Hook”。涉及 SSR/Hydration 的 API 这里只定义契约，完整 Server Runtime 验证留到 Module 11.24。')
          update_lesson(paths[13],'RE-HOOK-008',new_title='Custom Hook 如何避免把 Browser-only 环境假设写死',new_desc='识别 window/document、初始化时机和 server-safe fallback 的接口约束；真正 SSR/Hydration Runtime 在 Module 11.24 学完后再做端到端验证。')
          update_lesson(paths[13],'RE-STORE-007',new_desc='理解该参数用于给 Server Render 提供初始 Snapshot；当前只学习 API contract 和纯函数约束，不在本 Module 搭 SSR Runtime，实际 Hydration 验证留到 Module 11.24。')
          update_lesson(paths[13],'RE-STORE-008',new_desc='完成浏览器 online/offline 事件订阅和稳定 Snapshot；getServerSnapshot 只按已学 contract 提供占位值，SSR/Hydration 与自动化测试分别在 Module 11.24 / 11.23 验证。')

          update_lesson(paths[14],'RE-DATAROUTER-010',new_title='Deferred Route Data 为什么需要独立异步边界',new_desc='只建立“快数据先可用、慢数据后完成”的 Route Data 生命周期和接口边界，不在这里实现 Suspense；Suspense 与 Streaming 的正式模型留到 Module 11.17 / 11.24。')

          update_lesson(paths[16],'RE-ACTION-008',new_title='Action 如何与 Router 和未来 Server Mutation Boundary 对接',new_desc='比较 client action 与已学 route action，并只建立“未来可把 mutation 放到 server boundary”的接口概念；Server Function / `use server` 的实现统一留到 Module 11.25。')
          update_lesson(paths[16],'RE-ACTIONSTATE-007',new_title='Action State 如何与未来 Server Mutation Result 对接',new_desc='先设计 client UX state 与远端 mutation result 的序列化合同，不实现 Server Function；完整 Server Function + useActionState 组合留到 Module 11.25。')

          update_lesson(paths[17],'RE-TRANSITION-011',new_desc='用 CPU throttle 和课程给定的最小交互 timing 对比输入响应性；完整 React Profiler / Browser Trace 在下一 Module 11.18。')
          update_lesson(paths[17],'RE-DEFER-007',new_title='DeferredValue 是否改善响应性，怎样建立最小证据对比',new_desc='固定数据量与设备条件，用输入响应时间和 Render 日志做最小对照；Profiler / Performance 的系统测量在下一 Module 11.18。')
          update_lesson(paths[17],'RE-SUSPENSE-005',new_title='Suspense 为什么只处理 Pending，而不负责普通 Error',new_desc='建立“Promise pending 进入 Suspense、真正 Error 进入独立错误恢复边界”的职责划分；Error Boundary 的实现与恢复模型在 Module 11.21。')
          update_lesson(paths[17],'RE-SUSPENSE-016',new_desc='组合 Lazy、Query/Resource、Nested Boundary、Transition 并主动制造 Waterfall；错误路径使用课程提供的 TeachingErrorBoundary 作为教学基础设施，不要求理解其 Class 实现，完整 Error Model 在 Module 11.21。')
          update_lesson(paths[17],'RE-USE-004',new_title='use() 读取的 Promise Reject 后应该进入什么错误路径',new_desc='制造 Promise rejection，并使用课程提供的 TeachingErrorBoundary 验证 rejected path；本课关注 use() / Suspense 契约，Error Boundary 实现与恢复 UI 在 Module 11.21。')
          update_lesson(paths[17],'RE-ACTIVITY-015',new_desc='输出异步边界图、State/Cache Map、用户交互 timing/log baseline 和已知性能问题；下一 Module 11.18 再把同一 Workbench 升级为 Profiler/Trace 证据。')

          # 5) Error Boundary uses a provided boundary until Legacy Class Component is formally taught.
          update_lesson(paths[21],'RE-ERROR-002',new_desc='先使用课程提供的最小 TeachingErrorBoundary 验证 Render Error 的捕获范围，重点学习 Boundary 行为和恢复合同；其 Class Component 实现形态在 Module 11.33 再正式阅读。')

          # 6) Move SSR/Hydration-specific security/debug/test lessons to their real owner module.
          for lesson_id in ['RE-SEC-008']:
              b=pop_lesson(paths[22],lesson_id); insert_before_lesson(paths[24],'RE-HYDRATE-001',b)
          for lesson_id in ['RE-SEC-009','RE-DEBUG-008']:
              b=pop_lesson(paths[22],lesson_id); insert_before_lesson(paths[24],'RE-STREAMSSR-001',b)
          b=pop_lesson(paths[23],'RE-TEST-013'); insert_before_lesson(paths[24],'RE-STREAMSSR-001',b)
          b=pop_lesson(paths[24],'RE-STATIC-008'); insert_before_lesson(paths[25],'RE-RSCDATA-012',b)

          replace_once(paths[22],
              '本 Module 不重教完整 Web A11Y，而是聚焦 React 动态 UI、Portal、Route、Suspense、Virtualization、useId 与 Focus 管理的框架连接点。',
              '本 Module 不重教完整 Web A11Y / Web Security，而是聚焦截至当前位置已经学过的 React 动态 UI、Portal、Route、Suspense、Virtualization、HTML/URL Sink 与 Debugging 连接点。SSR/Hydration 与 RSC/Server Function 的专项安全问题分别回到 Module 11.24 / 11.25。')
          update_lesson(paths[22],'RE-A11Y-002',new_desc='为 label/input/aria relationship 生成稳定 ID；当前先学习客户端稳定性约束，Server/Client ID 一致性在 Module 11.24 Hydration 中验证。')
          update_lesson(paths[22],'RE-SEC-010',new_title='Server → Client Serialization Boundary 为什么可能泄漏敏感数据',new_desc='先用已经学过的 API DTO / serialized payload 分析“服务器对象被过度传到客户端”的泄漏风险；RSC-specific serialization/data leak 在 Module 11.25 再落到 Server Component Boundary。')
          update_lesson(paths[22],'RE-SEC-011',new_title='任何 Client-triggered Server Mutation 为什么都必须重新授权',new_desc='使用已学 API / Route Action / Form Mutation 证明“隐藏按钮”不构成 Authorization；Server Function 的直接调用攻击在 Module 11.25 再验证。')
          update_lesson(paths[22],'RE-SEC-012',new_title='CSRF / Cookie Auth 与 Form Mutation 的连接点',new_desc='理解浏览器自动携带 Cookie Credential 时，任何 Form/API mutation 都需要正确的 CSRF / SameSite / Origin 防线；不依赖尚未学习的 Server Function。')
          update_lesson(paths[22],'RE-DEBUG-014',new_desc='从截至本 Module 已正式学习的 React 故障池随机抽取五类完成复现、证据、根因、修复和回归验证；Hydration/RSC 专项故障留到其 Owner Module 后再加入演练池。')

          replace_once(paths[23],
              '本 Module 只覆盖 React-specific 测试方法，把 Component 行为、用户交互、Hook、Context、Router、Query、Suspense、Error Boundary、Timer 和 Hydration 的可验证性串起来。',
              '本 Module 只覆盖截至当前位置已经学过的 Client React-specific 测试方法，把 Component 行为、用户交互、Hook、Context、Router、Query、Suspense、Error Boundary 和 Timer 的可验证性串起来。SSR/Hydration 测试在学完 Module 11.24 后追加。')
          update_lesson(paths[23],'RE-TEST-012',new_desc='处理 debounce/timer，并明确不要把 React 内部调度简单等同为普通 timer；Scheduler Internals 在 Module 11.29 再解释原因。')
          update_lesson(paths[23],'RE-TEST-014',new_title='建立 Client React Test Matrix',new_desc='为 state/form/router/query/suspense/error 各定义最小必要测试层；SSR/Hydration 在 Module 11.24 扩展，完整 Unit/Integration/E2E/Visual 质量工程留到后续 Testing Stage。')

          # Update moved lessons in SSR owner module and clarify untaught Node/Bundler infrastructure.
          replace_once(paths[24],
              '本 Module 不依赖 Next.js 黑盒，从 React Server Renderer 开始建立 Request → React Tree → HTML/Stream → Browser 的完整模型。',
              '本 Module 不依赖 Next.js 黑盒，从 React Server Renderer 开始建立 Request → React Tree → HTML/Stream → Browser 的完整模型。由于 Node.js Runtime 与 Bundler 分别在后续 Stage 15 / 16 正式学习，本 Module 的 HTTP Server、多入口 Build、Proxy 等非 React 部分统一作为教学基础设施提供；当前只要求理解 React-side SSR/Hydration/Streaming/Prerender 因果链。')
