              if bad in all_text: raise SystemExit(f'stale reference remains: {bad}')
          assert 'RE-SEC-008' not in read(paths[22]) and 'RE-SEC-008' in read(paths[24])
          assert 'RE-SEC-009' not in read(paths[22]) and 'RE-SEC-009' in read(paths[24])
          assert 'RE-DEBUG-008' not in read(paths[22]) and 'RE-DEBUG-008' in read(paths[24])
          assert 'RE-TEST-013' not in read(paths[23]) and 'RE-TEST-013' in read(paths[24])
          assert 'RE-STATIC-008' not in read(paths[24]) and 'RE-STATIC-008' in read(paths[25])
          assert 'RE-STATEARCH-023' not in read(paths[10]) and 'RE-STATEARCH-023' in read(paths[13])
          assert '# Module 11.30：Server Renderer、Hydration、RSC Internals 与 Source Debug Capstone' in read(paths[30])
          print('verified modules=35 lessons=1101 unique_ids=1101')
          PY

