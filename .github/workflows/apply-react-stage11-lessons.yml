name: Apply React Stage 11 Lesson Outline

on:
  push:
    branches: [main]
    paths:
      - 'learn-frontend-web-course/stage11-react/.lesson-outline-tail.md'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace React outline tail
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('learn-frontend-web-course/stage11-react/README.md')
          patch = Path('learn-frontend-web-course/stage11-react/.lesson-outline-tail.md')
          text = readme.read_text(encoding='utf-8')
          tail = patch.read_text(encoding='utf-8').rstrip() + '\n'

          marker = '# Module 11.19：Ref 一次学透'
          if marker not in text:
              raise SystemExit(f'marker not found: {marker}')

          text = text[:text.index(marker)] + tail
          text = text.replace('> 版本：v1.2-draft', '> 版本：v2.0-draft', 1)
          old = '当前已经把 `Module 11.01 ～ 11.18` 拆到 Lesson 粒度；后续继续保持完全相同的规则向 11.78 推进。'
          new = '当前 `Module 11.01 ～ 11.78` 已全部拆到 Lesson 粒度；正式课程编写前只继续做全局依赖、重复、粒度与 Knowledge Ceiling 复审。'
          text = text.replace(old, new, 1)
          readme.write_text(text, encoding='utf-8')
          PY
      - name: Commit updated outline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learn-frontend-web-course/stage11-react/README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'complete React Stage 11 lesson breakdown'
          git push origin HEAD:main
