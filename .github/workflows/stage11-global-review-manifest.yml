name: Stage 11 Global Review Manifest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage11-global-review-manifest.yml'

permissions:
  contents: write

jobs:
  review-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build review manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          base = Path('learn-frontend-web-course/stage11-react')
          modules = sorted(base.glob('module11-*/README.md'))
          if len(modules) != 35:
              raise SystemExit(f'expected 35 modules, got {len(modules)}')

          data = {'module_count': len(modules), 'modules': []}
          lesson_re = re.compile(r'^<a id="lesson-[^"]+"></a>\n### Lesson ([A-Za-z0-9-]+)：(.+?)\n\n(.*?)(?=\n<a id="lesson-|\n---\n\n> |\Z)', re.M | re.S)

          for idx, p in enumerate(modules, 1):
              text = p.read_text(encoding='utf-8')
              title = text.splitlines()[0].removeprefix('# ')
              intro_match = re.search(r'^> .*?\n\n(.*?)(?=\n<!-- LESSON_NAV:START -->)', text, re.M | re.S)
              intro = re.sub(r'\s+', ' ', intro_match.group(1).strip()) if intro_match else ''
              lessons = []
              for m in lesson_re.finditer(text):
                  desc = m.group(3).strip().split('\n\n')[0]
                  desc = re.sub(r'<[^>]+>', '', desc)
                  desc = re.sub(r'\s+', ' ', desc).strip()
                  lessons.append({'id': m.group(1), 'title': m.group(2).strip(), 'desc': desc})
              if not lessons:
                  raise SystemExit(f'no lessons parsed: {p}')
              data['modules'].append({'index': idx, 'path': str(p), 'title': title, 'intro': intro, 'lesson_count': len(lessons), 'lessons': lessons})

          data['lesson_count'] = sum(m['lesson_count'] for m in data['modules'])
          out = Path('/tmp/stage11-review-manifest.json')
          out.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          print('modules=', data['module_count'], 'lessons=', data['lesson_count'], 'bytes=', out.stat().st_size)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: stage11-review-manifest
          path: /tmp/stage11-review-manifest.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stage11-global-review-manifest.yml
          git commit -m 'chore: remove Stage 11 review manifest workflow'
          git push origin HEAD:main
