name: Consolidate React Stage 11 Modules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-react-stage11-modules.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate module headings without removing lessons
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('learn-frontend-web-course/stage11-react/README.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
            '# Module 11.01：React 是什么、为什么需要 React': '# Module 11.01：React Problem Domain、Project Bootstrap 与 Root Lifecycle',
            '# Module 11.04：JSX 一次学透': '# Module 11.02：JSX 与 React Object Model',
            '# Module 11.06：Function Component、Pure Render 与 StrictMode': '# Module 11.03：Component、Pure Render、Props 与 Composition',
            '# Module 11.08：Conditional Rendering、List、Key 与 Identity': '# Module 11.04：Conditional Rendering、List、Key 与 Identity',
            '# Module 11.09：React Event System': '# Module 11.05：React Event System',
            '# Module 11.10：State 与 useState 一次学透': '# Module 11.06：State Fundamentals、Render Snapshot、Update Queue 与 Batching',
            '# Module 11.12：Object / Array State 与不可变更新': '# Module 11.07：Immutable State 与 Component Identity',
            '# Module 11.14：State Modeling 与 Ownership': '# Module 11.08：State Modeling 与 Ownership',
            '# Module 11.15：React Form 完整体系': '# Module 11.09：React Form 完整体系',
            '# Module 11.16：useReducer 与复杂状态': '# Module 11.10：Reducer、Context 与 State Architecture',
            '# Module 11.19：Ref 一次学透': '# Module 11.11：Ref 与 Imperative Escape Hatches',
            '# Module 11.21：useEffect 一次学透': '# Module 11.12：Effect 与 External Synchronization',
            '# Module 11.25：Custom Hook 一次学透': '# Module 11.13：Custom Hook 与 External Store Integration',
            '# Module 11.27：Router 完整体系': '# Module 11.14：Router 与 Route Data Architecture',
            '# Module 11.29：Server State 完整模型': '# Module 11.15：Server State、TanStack Query 与 API Boundary',
            '# Module 11.32：React Actions': '# Module 11.16：Actions 与 Optimistic Mutations',
            '# Module 11.35：Concurrent Rendering Mental Model': '# Module 11.17：Concurrent React：Transition、Suspense、use 与 Activity',
            '# Module 11.41：React DevTools Profiler 与 Performance Track': '# Module 11.18：Profiling、Render Performance、Memoization 与 React Compiler',
            '# Module 11.45：React DOM Integration': '# Module 11.19：React DOM 与 Portal',
            '# Module 11.47：Resource Loading / Metadata': '# Module 11.20：Resource Loading 与 Metadata',
            '# Module 11.48：React Error Model': '# Module 11.21：React Error Model',
            '# Module 11.49：React-specific Accessibility': '# Module 11.22：React-specific Accessibility、Security 与 Debugging',
            '# Module 11.52：React Testing Integration': '# Module 11.23：React Testing Integration',
            '# Module 11.53：SSR Mental Model': '# Module 11.24：SSR、Hydration、Streaming 与 Prerender',
            '# Module 11.57：RSC Mental Model': '# Module 11.25：RSC、Server/Client Boundary、Server Functions 与 Data/Cache Architecture',
            '# Module 11.62：React 源码研究方法': '# Module 11.26：React Source Research 与 Fiber Model',
            '# Module 11.64：Reconciler': '# Module 11.27：Reconciler 与 Render / Commit Pipeline',
            '# Module 11.66：Hooks Internals': '# Module 11.28：Hooks 与 Update Queue Internals',
            '# Module 11.68：Lane 与 Scheduler': '# Module 11.29：Lane、Scheduler 与 Suspense / Activity Internals',
            '# Module 11.70：Server Renderer / Hydration / RSC Internals': '# Module 11.30：Server Renderer、Hydration 与 RSC Internals',
            '# Module 11.71：React Library Authoring': '# Module 11.31：React Library 与 Headless Component Architecture',
            '# Module 11.73：Large-scale React Application Architecture': '# Module 11.32：Large-scale React Architecture 与 Microfrontend Boundary',
            '# Module 11.75：Legacy React': '# Module 11.33：Legacy React 与 Migration',
            '# Module 11.77：React Upgrade Governance': '# Module 11.34：React Upgrade Governance',
            '# Module 11.78：React Architecture Review 与最终综合项目': '# Module 11.35：React Architecture Review 与最终综合项目',
          }

          absorbed = [
            '# Module 11.02：从空目录建立 React + TypeScript 项目',
            '# Module 11.03：React Root 与应用启动生命周期',
            '# Module 11.05：React Element、React Node、Component、DOM Node',
            '# Module 11.07：Props、Children 与单向数据流',
            '# Module 11.11：Render Snapshot、Update Queue 与 Batching',
            '# Module 11.13：Component Identity 与 State Preservation',
            '# Module 11.17：Context 一次学透',
            '# Module 11.18：React State Architecture',
            '# Module 11.20：Imperative API 与 useImperativeHandle',
            '# Module 11.22：Removing Effects',
            '# Module 11.23：useEffectEvent',
            '# Module 11.24：useLayoutEffect / useInsertionEffect',
            '# Module 11.26：useSyncExternalStore',
            '# Module 11.28：Data Router 与 Route Architecture',
            '# Module 11.30：TanStack Query 生产级使用',
            '# Module 11.31：API Client 与 React 数据边界',
            '# Module 11.33：useActionState / useFormStatus',
            '# Module 11.34：useOptimistic',
            '# Module 11.36：Transition',
            '# Module 11.37：useDeferredValue',
            '# Module 11.38：Suspense 一次学透',
            '# Module 11.39：use()',
            '# Module 11.40：Activity',
            '# Module 11.42：React Render Performance',
            '# Module 11.43：Memoization',
            '# Module 11.44：React Compiler',
            '# Module 11.46：Portal',
            '# Module 11.50：React-specific Security',
            '# Module 11.51：React Debugging & Failure Model',
            '# Module 11.54：Hydration 一次学透',
            '# Module 11.55：Streaming SSR',
            '# Module 11.56：Static Rendering / Prerender / Resume',
            '# Module 11.58：Server / Client Boundary',
            '# Module 11.59：Server Functions',
            '# Module 11.60：RSC + Suspense + use()',
            '# Module 11.61：RSC Data / Cache Architecture',
            '# Module 11.63：Fiber 一次学透',
            '# Module 11.65：Render / Commit Pipeline',
            '# Module 11.67：Update Queue',
            '# Module 11.69：Suspense / Activity Internals',
            '# Module 11.72：React Headless Component Architecture',
            '# Module 11.74：React 在 Microfrontend 中的边界',
            '# Module 11.76：React Migration',
          ]

          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'missing heading: {old}')
            text = text.replace(old, new, 1)

          for heading in absorbed:
            if heading not in text:
              raise SystemExit(f'missing absorbed heading: {heading}')
            text = text.replace(heading + '\n\n', '', 1)

          text = text.replace('> 版本：v2.0-draft', '> 版本：v2.1-draft', 1)
          text = text.replace('当前 `Module 11.01 ～ 11.78` 已全部拆到 Lesson 粒度；正式课程编写前只继续做全局依赖、重复、粒度与 Knowledge Ceiling 复审。',
                              '当前 Stage 11 已收敛为 `Module 11.01 ～ 11.35`；原有 Lesson、综合项目、源码、性能、故障、迁移与治理内容全部保留，仅合并过碎 Module 边界。正式课程编写前只继续做全局依赖、重复、粒度与 Knowledge Ceiling 复审。', 1)
          text = text.replace('`Module 11.01 ～ Module 11.78` 已全部拆到 Lesson 粒度。',
                              '`Module 11.01 ～ Module 11.35` 已全部拆到 Lesson 粒度；这是在不删除任何 Lesson 内容的前提下，由原 78 个过碎 Module 收敛而来。', 1)
          text = text.replace('└── Module 11.01 ～ 11.78', '└── Module 11.01 ～ 11.35', 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify module count and lesson preservation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('learn-frontend-web-course/stage11-react/README.md').read_text(encoding='utf-8')
          modules = re.findall(r'^# Module 11\.\d{2}：', text, flags=re.M)
          lessons = re.findall(r'^### Lesson ', text, flags=re.M)
          print('modules=', len(modules), 'lessons=', len(lessons))
          if len(modules) != 35:
              raise SystemExit(f'expected 35 modules, got {len(modules)}')
          if len(lessons) < 700:
              raise SystemExit(f'lesson count unexpectedly low: {len(lessons)}')
          PY
      - name: Commit consolidated outline and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/consolidate-react-stage11-modules.yml
          git add learn-frontend-web-course/stage11-react/README.md
          git commit -m 'consolidate React Stage 11 into 35 owner modules'
          git push origin HEAD:main
