name: Unify course root once

"on":
  push:
    branches:
      - refactor/unify-course-root

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/unify-course-root
          fetch-depth: 0

      - name: Rewrite paths and course indexes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.name == 'unify-course-root-once.yml':
                  continue
              if path.suffix not in {'.md', '.json', '.ts', '.tsx', '.js', '.mjs', '.html', '.yml', '.yaml'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace('courses/frontend-architect/stage11-react', 'learn-frontend-web-course/stage11-react')
              updated = updated.replace('courses/frontend-architect', 'learn-frontend-web-course')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              '- React Module 11.01 的 8 课闭环规划与第一批 3 节正式课程；',
              '- React Module 11.01 的 8 / 8 节具体课程、Failure Lab 与 Module Project 已完成；'
          )
          react_section = '''### Stage 11：React

- [React Stage 详细设计与课程入口](./learn-frontend-web-course/stage11-react/README.md)
- [Module 11.01：React 的问题模型与声明式 UI](./learn-frontend-web-course/stage11-react/module11-01-react-problem-model/README.md)
- [RE-1101-001：手工 DOM 同步为什么会失控](./learn-frontend-web-course/stage11-react/module11-01-react-problem-model/01-manual-dom-sync-problem/README.md)
- [RE-1101-002：创建第一个 React 应用](./learn-frontend-web-course/stage11-react/module11-01-react-problem-model/02-first-react-application/README.md)
- [RE-1101-003：让状态声明 UI](./learn-frontend-web-course/stage11-react/module11-01-react-problem-model/03-state-declares-ui/README.md)
- [RE-1101-004：Component Tree 与单向更新流](./learn-frontend-web-course/stage11-react/module11-01-react-problem-model/04-component-tree-one-way-flow/README.md)
- [RE-1101-005：整体应用与局部接入边界](./learn-frontend-web-course/stage11-react/module11-01-react-problem-model/05-whole-app-vs-partial-roots/README.md)
- [RE-1101-006：Strict Mode 与第一套 Debug 基线](./learn-frontend-web-course/stage11-react/module11-01-react-problem-model/06-strict-mode-debug-baseline/README.md)
- [RE-1101-007：Failure Lab——重复状态与 DOM 逃生](./learn-frontend-web-course/stage11-react/module11-01-react-problem-model/07-failure-lab-duplicate-state-dom-escape/README.md)
- [RE-1101-008：Module Project——Release Console Migration](./learn-frontend-web-course/stage11-react/module11-01-react-problem-model/08-module-project-release-console-migration/README.md)
'''
          text = re.sub(r'### Stage 11：React\n.*?(?=\n`learn-frontend-web-course/README\.md`)', react_section.rstrip(), text, flags=re.S)
          directory_section = '''## 当前目录

```text
learn-frontend-web/
├── README.md
├── .github/
└── learn-frontend-web-course/
    ├── README.md
    ├── FRONTEND_TEACHING_GUIDE.md
    ├── stage-04-css/
    ├── stage-08-typescript/
    └── stage11-react/
        ├── README.md
        └── module11-01-react-problem-model/
            ├── README.md
            ├── 01-manual-dom-sync-problem/
            ├── 02-first-react-application/
            ├── 03-state-declares-ui/
            ├── 04-component-tree-one-way-flow/
            ├── 05-whole-app-vs-partial-roots/
            ├── 06-strict-mode-debug-baseline/
            ├── 07-failure-lab-duplicate-state-dom-escape/
            └── 08-module-project-release-console-migration/
```

现在只有一个课程根目录：`learn-frontend-web-course/`。Stage、Module、Lesson、README、源码和项目全部在这棵树中维护。
'''
          text = re.sub(r'## 当前目录\n.*?(?=\n---\n\n## 最终目标)', directory_section.rstrip(), text, flags=re.S)
          readme.write_text(text, encoding='utf-8')

          stage = Path('learn-frontend-web-course/stage11-react/README.md')
          text = stage.read_text(encoding='utf-8')
          text = re.sub(r'  \n> 正式课程：.*?\n', '\n', text, count=1)
          course_dir = '''## 9. 课程目录

Stage 11 不再拆分“设计目录”和“正式课程目录”，统一使用：

```text
learn-frontend-web-course/stage11-react/
├── README.md
└── module11-xx-topic/
    ├── README.md
    └── lesson-name/
        ├── README.md
        ├── package.json
        ├── index.html
        ├── src/
        └── 运行所需配置
```

Module README 同时负责知识边界、Lesson 索引和验收标准；Lesson 目录直接保存详细教学文档与完整可运行源码。
'''
          text = re.sub(r'## 9\. 课程目录\n.*?(?=\n---\n\n## 10\. Stage 验收标准)', course_dir.rstrip(), text, flags=re.S)
          progress = '''## 11. 当前建设进度

### 已完成

- [x] Stage 11 的 26 个 Owner Module 边界。
- [x] Stage 11 轻量建设路线与验收标准。
- [x] Module 11.01 详细设计。
- [x] Module 11.01 的 RE-1101-001 ～ RE-1101-008 全部具体课程。
- [x] Module 11.01 Failure Lab、Strict Mode Debug、局部 Root 实验。
- [x] Release Console Migration Module Project、迁移报告与自动验证脚本。
- [x] Module 11.01 边界、重复、依赖、粒度和知识上限复审。

### 当前学习入口

- [Module 11.01：React 的问题模型与声明式 UI](./module11-01-react-problem-model/README.md)

### 下一步

进入 Module 11.02：JSX、Element、Component 与 Render Output，继续采用“轻规划 → 具体 Lesson → Module Project → Review”的节奏。
'''
          text = re.sub(r'## 11\. 当前建设进度\n.*\Z', progress.rstrip() + '\n', text, flags=re.S)
          stage.write_text(text, encoding='utf-8')

          module = Path('learn-frontend-web-course/stage11-react/module11-01-react-problem-model/README.md')
          text = module.read_text(encoding='utf-8')
          text = re.sub(r'  \n> 正式课程：.*?\n', '\n', text, count=1)
          module.write_text(text, encoding='utf-8')
          PY

      - name: Commit rewritten paths and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/unify-course-root-once.yml
          git config user.name "ningbingjian"
          git config user.email "ningbingjian@126.com"
          git add -A
          git commit -m "docs(course): rewrite paths for single course root [skip ci]"
          git push origin HEAD:refactor/unify-course-root
