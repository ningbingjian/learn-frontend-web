name: Bootstrap Stage 08 TypeScript

"on":
  push:
    branches:
      - feat/stage-08-typescript-foundation
    paths:
      - ".stage-08-payload.part*"
      - ".github/workflows/bootstrap-stage-08.yml"

permissions:
  contents: write

jobs:
  expand-course:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Expand verified course payload
        shell: bash
        run: |
          set -euo pipefail
          cat .stage-08-payload.part* > /tmp/stage-08.tar.gz.b64
          base64 --decode /tmp/stage-08.tar.gz.b64 > /tmp/stage-08.tar.gz
          echo "4bfb3376fa488562711c3b1e3a220672781cea93c7ec62fea2b294d17519a9a0  /tmp/stage-08.tar.gz" | sha256sum --check -
          tar -xzf /tmp/stage-08.tar.gz
          rm -f .stage-08-payload.part*

      - name: Commit expanded course
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "course(ts): expand Stage 08 lesson sources"
          git push origin HEAD:feat/stage-08-typescript-foundation
