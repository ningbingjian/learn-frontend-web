name: Export Latest Stage 04

on:
  push:
    branches:
      - fix/stage-04-boundary-cleanup
    paths:
      - ".github/workflows/apply-stage04-boundary-fix.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build Stage 04 source archive
        shell: bash
        run: |
          set -euo pipefail
          tar -czf stage04-latest-main.tar.gz \
            learn-frontend-web-course/stage-04-css \
            .github/workflows/stage-04-css.yml
          sha256sum stage04-latest-main.tar.gz

      - name: Upload Stage 04 source archive
        uses: actions/upload-artifact@v4
        with:
          name: stage04-latest-main
          path: stage04-latest-main.tar.gz
          if-no-files-found: error
          retention-days: 1
