name: Export Generated Stage 04 Boundary Fix

on:
  push:
    branches:
      - fix/stage-04-boundary-cleanup
    paths:
      - ".github/workflows/apply-stage04-boundary-fix.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/stage-04-boundary-cleanup

      - name: Rebuild generated fix archive
        shell: bash
        run: |
          set -euo pipefail
          cat .stage04-boundary-fix/part-* > stage04-boundary-fix.tar.gz.b64
          base64 --decode stage04-boundary-fix.tar.gz.b64 > stage04-boundary-fix.tar.gz
          gzip -t stage04-boundary-fix.tar.gz
          sha256sum stage04-boundary-fix.tar.gz

      - name: Upload generated fix archive
        uses: actions/upload-artifact@v4
        with:
          name: stage04-generated-boundary-fix
          path: stage04-boundary-fix.tar.gz
          if-no-files-found: error
          retention-days: 1
