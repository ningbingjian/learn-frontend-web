<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP078 iframe 懒加载</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.6; }
    iframe { width: min(100%, 640px); height: 180px; border: 1px solid currentColor; display: block; }
    .spacer { min-height: 180vh; display: grid; place-items: center; background: #f5f5f5; margin-block: 2rem; }
    pre { padding: 1rem; background: #f4f4f4; min-height: 8rem; }
  </style>
</head>
<body>
  <h1>iframe 懒加载</h1>
  <p>刷新页面后观察日志，再向下滚动接近第二个 iframe。</p>

  <h2>首屏 eager iframe</h2>
  <iframe id="eager-frame" src="./probe.html?slot=eager" title="首屏立即加载示例" loading="eager"></iframe>

  <div class="spacer">向下滚动寻找 lazy iframe</div>

  <h2>非首屏 lazy iframe</h2>
  <iframe id="lazy-frame" src="./probe.html?slot=lazy" title="非首屏懒加载示例" loading="lazy"></iframe>

  <h2>加载日志</h2>
  <pre id="log"></pre>

  <script>
    const output = document.querySelector('#log');
    const startedAt = performance.now();

    function log(message) {
      const delta = (performance.now() - startedAt).toFixed(1);
      output.textContent += `[+${delta} ms] ${message}\n`;
    }

    document.querySelector('#eager-frame').addEventListener('load', () => log('eager iframe load 事件'));
    document.querySelector('#lazy-frame').addEventListener('load', () => log('lazy iframe load 事件'));

    window.addEventListener('message', event => {
      if (location.protocol !== 'file:' && event.origin !== location.origin) return;
      if (event.data?.type !== 'iframe-probe') return;
      log(`${event.data.slot} 子页面脚本已执行`);
    });

    log('父页面开始观察');
  </script>
</body>
</html>
