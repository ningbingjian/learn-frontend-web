<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP071 - picture 艺术方向</title>
  <style>
    body { max-width: 900px; margin: 40px auto; padding: 0 20px; font-family: system-ui, sans-serif; line-height: 1.7; }
    picture, img { display: block; }
    img { width: 100%; height: auto; border: 1px solid #bbb; }
    pre { padding: 14px; background: #f5f5f5; overflow: auto; }
  </style>
</head>
<body>
  <h1>`picture` 艺术方向</h1>
  <p>把视口调整到 640px 以下，观察构图和 currentSrc 的变化。</p>

  <picture>
    <source media="(max-width: 640px)" srcset="./narrow.svg">
    <img id="hero" src="./wide.svg" alt="响应式课程封面" width="960" height="480">
  </picture>

  <h2>匹配结果</h2>
  <pre id="result"></pre>

  <script>
    const hero = document.querySelector('#hero');
    const result = document.querySelector('#result');
    const mobile = matchMedia('(max-width: 640px)');

    function render() {
      result.textContent = [
        `viewport：${window.innerWidth}px`,
        `media 匹配：${mobile.matches}`,
        `img fallback src：${hero.getAttribute('src')}`,
        `currentSrc：${hero.currentSrc}`
      ].join('\n');
    }

    hero.addEventListener('load', render);
    mobile.addEventListener('change', render);
    window.addEventListener('resize', render);
    render();
  </script>
</body>
</html>
