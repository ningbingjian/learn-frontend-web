<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP068 - figcaption 图注</title>
  <style>
    body { max-width: 820px; margin: 40px auto; padding: 0 20px; font-family: system-ui, sans-serif; line-height: 1.7; }
    figure { margin: 28px 0; padding: 16px; border: 1px solid #bbb; }
    img { max-width: 100%; height: auto; display: block; }
    figcaption { padding: 10px 0; font-weight: 600; }
    pre { padding: 16px; background: #f5f5f5; }
  </style>
</head>
<body>
  <h1>figcaption 图注</h1>

  <figure id="after-caption">
    <img
      src="./diagram.svg"
      alt="浏览器请求 CDN，缓存未命中后由 CDN 回源请求源站"
      width="720"
      height="320"
    >
    <figcaption>图 1：静态资源请求链路，教学简化示意</figcaption>
  </figure>

  <figure id="before-caption">
    <figcaption>图 2：同一图示，使用前置图注</figcaption>
    <img
      src="./diagram.svg"
      alt="浏览器、CDN 与源站之间的请求关系"
      width="720"
      height="320"
    >
  </figure>

  <pre id="result"></pre>

  <script>
    const lines = [...document.querySelectorAll('figure')].map(figure => {
      const caption = figure.querySelector(':scope > figcaption');
      const position = caption === figure.firstElementChild ? 'first' : 'last';
      return `${figure.id}：figcaption = ${position}`;
    });
    document.querySelector('#result').textContent = lines.join('\n');
  </script>
</body>
</html>
