<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可信 iframe 子页面</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; line-height: 1.5; }
    button { margin-right: .75rem; margin-bottom: .75rem; }
    pre { background: #f4f4f4; padding: .75rem; }
  </style>
</head>
<body>
  <h1>可信子页面</h1>
  <button id="send" type="button">向父页面发送消息</button>
  <button id="fullscreen" type="button">尝试全屏</button>
  <pre id="status"></pre>

  <script>
    const status = document.querySelector('#status');
    const parentOrigin = document.referrer ? new URL(document.referrer).origin : '';

    status.textContent = `child origin = ${location.origin}\nparent origin = ${parentOrigin}\n`;

    document.querySelector('#send').addEventListener('click', () => {
      if (!parentOrigin) {
        status.textContent += '无法确定父页面 origin，请通过 HTTP iframe 运行。\n';
        return;
      }

      parent.postMessage({
        type: 'trusted-demo',
        action: 'request-theme',
        value: 'dark'
      }, parentOrigin);

      status.textContent += '已使用具体 parentOrigin 发送消息。\n';
    });

    window.addEventListener('message', event => {
      if (event.origin !== parentOrigin) {
        status.textContent += `拒绝父页面消息：${event.origin}\n`;
        return;
      }
      if (event.source !== parent) return;
      if (event.data?.type !== 'parent-demo') return;
      status.textContent += `接受父页面消息：${event.data.message}\n`;
    });

    document.querySelector('#fullscreen').addEventListener('click', async () => {
      try {
        await document.documentElement.requestFullscreen();
        status.textContent += 'Fullscreen 请求成功。\n';
      } catch (error) {
        status.textContent += `Fullscreen 请求失败：${error.name}\n`;
      }
    });
  </script>
</body>
</html>
