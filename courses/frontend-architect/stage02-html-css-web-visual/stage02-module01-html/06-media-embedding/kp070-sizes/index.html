<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP070 - sizes</title>
  <style>
    body { margin: 40px 20px; font-family: system-ui, sans-serif; line-height: 1.7; }
    .media {
      width: calc(100vw - 40px);
      max-width: 100%;
      height: auto;
      display: block;
      border: 1px solid #bbb;
    }
    @media (min-width: 601px) {
      .media { width: 50vw; }
    }
    @media (min-width: 1001px) {
      .media { width: 480px; }
    }
    pre { max-width: 760px; padding: 16px; background: #f5f5f5; overflow: auto; }
  </style>
</head>
<body>
  <h1>sizes 与响应式 slot</h1>

  <img
    id="responsive-image"
    class="media"
    src="./photo-800.svg"
    srcset="./photo-480.svg 480w, ./photo-800.svg 800w, ./photo-1200.svg 1200w"
    sizes="(max-width: 600px) calc(100vw - 40px), (max-width: 1000px) 50vw, 480px"
    alt="响应式图片候选示意图"
  >

  <h2>当前选择</h2>
  <pre id="result"></pre>

  <script>
    const image = document.querySelector('#responsive-image');
    const result = document.querySelector('#result');

    function fileName(url) {
      return url ? new URL(url).pathname.split('/').pop() : '尚未选择';
    }

    function currentRule() {
      if (matchMedia('(max-width: 600px)').matches) return 'calc(100vw - 40px)';
      if (matchMedia('(max-width: 1000px)').matches) return '50vw';
      return '480px';
    }

    function render() {
      result.textContent = [
        `viewport：${window.innerWidth}px`,
        `devicePixelRatio：${window.devicePixelRatio}`,
        `sizes 命中：${currentRule()}`,
        `实际渲染宽度：${image.clientWidth}px`,
        `currentSrc：${fileName(image.currentSrc)}`
      ].join('\n');
    }

    window.addEventListener('load', render);
    window.addEventListener('resize', render);
    image.addEventListener('load', render);
  </script>
</body>
</html>
