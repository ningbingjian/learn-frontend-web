<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP079 iframe sandbox</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.6; }
    .grid { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    iframe { width: 100%; height: 220px; border: 1px solid currentColor; }
    pre { padding: 1rem; background: #f4f4f4; min-height: 5rem; }
  </style>
</head>
<body>
  <h1>iframe sandbox</h1>
  <p>对比默认 sandbox 与只恢复脚本能力后的行为。</p>

  <div class="grid">
    <section>
      <h2>默认 sandbox</h2>
      <iframe src="./sandbox-child.html?case=default" title="默认 sandbox 限制示例" sandbox></iframe>
    </section>

    <section>
      <h2>allow-scripts</h2>
      <iframe src="./sandbox-child.html?case=scripts" title="允许脚本的 sandbox 示例" sandbox="allow-scripts"></iframe>
    </section>
  </div>

  <h2>父页面收到的消息</h2>
  <pre id="log">等待 sandbox 子页面消息……\n</pre>

  <script>
    const log = document.querySelector('#log');

    window.addEventListener('message', event => {
      if (event.data?.type !== 'sandbox-demo') return;
      log.textContent += `case=${event.data.case}, event.origin=${event.origin}\n`;
    });
  </script>
</body>
</html>
