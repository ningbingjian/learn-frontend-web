<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP072 - source 类型与媒体条件</title>
  <style>
    body { max-width: 840px; margin: 40px auto; padding: 0 20px; font-family: system-ui, sans-serif; line-height: 1.7; }
    img { display: block; width: 100%; height: auto; border: 1px solid #bbb; }
    pre { padding: 14px; background: #f5f5f5; overflow: auto; }
  </style>
</head>
<body>
  <h1>`source` 的 type 与 media</h1>
  <picture id="picture-demo">
    <source srcset="./ignored.svg" type="image/x-teaching-unsupported">
    <source media="(min-width: 600px)" srcset="./preferred.svg" type="image/svg+xml">
    <img id="demo" src="./fallback.svg" alt="格式选择实验" width="800" height="400">
  </picture>

  <pre id="result"></pre>

  <script>
    const image = document.querySelector('#demo');
    const sources = [...document.querySelectorAll('#picture-demo source')];
    const result = document.querySelector('#result');

    function render() {
      const sourceInfo = sources.map((source, index) =>
        `source ${index + 1}：type=${source.type || '(无)'}，media=${source.media || '(无)'}`
      );
      result.textContent = [
        `viewport：${innerWidth}px`,
        ...sourceInfo,
        `fallback src：${image.getAttribute('src')}`,
        `currentSrc：${image.currentSrc}`
      ].join('\n');
    }

    image.addEventListener('load', render);
    window.addEventListener('resize', render);
    render();
  </script>
</body>
</html>
