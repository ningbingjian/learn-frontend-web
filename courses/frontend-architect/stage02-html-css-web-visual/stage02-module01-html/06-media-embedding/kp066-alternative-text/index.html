<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP066 - 图片替代文本</title>
  <style>
    body { max-width: 800px; margin: 40px auto; padding: 0 20px; font-family: system-ui, sans-serif; line-height: 1.7; }
    .status { width: min(100%, 640px); height: auto; display: block; }
    .icon { vertical-align: middle; }
    .bad { padding: 12px; border: 1px dashed #999; }
    pre { background: #f5f5f5; padding: 16px; overflow: auto; }
  </style>
</head>
<body>
  <h1>图片替代文本</h1>

  <section>
    <h2>信息图片</h2>
    <img
      id="status-image"
      class="status"
      src="./status.svg"
      alt="构建状态：测试 128 项全部通过"
      width="640"
      height="240"
    >
  </section>

  <section>
    <h2>今日推荐 <img class="icon" src="./sparkle.svg" alt="" width="32" height="32"></h2>
    <p>星星只负责装饰，所以使用空 alt。</p>
  </section>

  <section class="bad">
    <h2>教学反例</h2>
    <p>下面图片故意缺少 alt，仅用于比较：</p>
    <img id="bad-example" src="./sparkle.svg" width="32" height="32">
  </section>

  <h2>DOM 检查</h2>
  <pre id="result"></pre>

  <script>
    const result = document.querySelector('#result');
    const lines = [...document.querySelectorAll('img')].map((image, index) =>
      `图片 ${index + 1}：has alt = ${image.hasAttribute('alt')}，alt = ${JSON.stringify(image.getAttribute('alt'))}`
    );
    result.textContent = lines.join('\n');
  </script>
</body>
</html>
