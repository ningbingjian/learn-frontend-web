<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP075 - track 字幕轨道</title>
  <style>
    body { max-width: 760px; margin: 40px auto; padding: 0 20px; font-family: system-ui, sans-serif; line-height: 1.7; }
    video { display: block; max-width: 100%; background: #111; }
    pre { padding: 14px; background: #f5f5f5; overflow: auto; }
  </style>
</head>
<body>
  <h1>`track` 字幕轨道</h1>

  <video id="demo" controls preload="metadata" width="320" height="180">
    <source src="./sample.mp4" type="video/mp4">
    <track kind="subtitles" src="./subtitles-zh.vtt" srclang="zh-CN" label="中文" default>
    <track kind="subtitles" src="./subtitles-en.vtt" srclang="en" label="English">
  </video>

  <pre id="result">等待字幕轨道……</pre>

  <script>
    const video = document.querySelector('#demo');
    const result = document.querySelector('#result');

    function render() {
      const rows = [...video.textTracks].map((track, index) =>
        `${index + 1}. kind=${track.kind}, language=${track.language}, label=${track.label}, mode=${track.mode}, cues=${track.cues ? track.cues.length : '(未加载)'}`
      );
      result.textContent = [`textTracks：${video.textTracks.length}`, ...rows].join('\n');
    }

    video.addEventListener('loadedmetadata', render);
    for (const track of video.textTracks) {
      track.addEventListener('cuechange', render);
    }
    setTimeout(render, 500);
    render();
  </script>
</body>
</html>
