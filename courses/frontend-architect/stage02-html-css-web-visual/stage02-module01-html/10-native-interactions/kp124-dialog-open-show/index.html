<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP124 dialog open 与 show</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    dialog { border: 1px solid #777; border-radius: 10px; padding: 20px; }
  </style>
</head>
<body>
  <h1>非模态 dialog</h1>

  <dialog open>
    <p>这个 dialog 通过 <code>open</code> 属性初始显示。</p>
  </dialog>

  <p style="margin-top:120px">
    <button id="open-profile" type="button">使用 show() 打开资料面板</button>
    <button id="background-action" type="button">背景操作</button>
  </p>
  <p id="counter">背景按钮点击：0 次</p>
  <p id="state">profile-dialog.open = false</p>

  <dialog id="profile-dialog">
    <h2>资料面板</h2>
    <p>这是非模态对话框，外部页面仍可操作。</p>
    <button id="close-profile" type="button">关闭</button>
  </dialog>

  <script>
    const dialog = document.querySelector('#profile-dialog');
    const state = document.querySelector('#state');
    let count = 0;

    document.querySelector('#open-profile').addEventListener('click', () => {
      if (!dialog.open) dialog.show();
      state.textContent = `profile-dialog.open = ${dialog.open}`;
    });
    document.querySelector('#close-profile').addEventListener('click', () => {
      dialog.close();
      state.textContent = `profile-dialog.open = ${dialog.open}`;
    });
    document.querySelector('#background-action').addEventListener('click', () => {
      count += 1;
      document.querySelector('#counter').textContent = `背景按钮点击：${count} 次`;
    });
  </script>
</body>
</html>
