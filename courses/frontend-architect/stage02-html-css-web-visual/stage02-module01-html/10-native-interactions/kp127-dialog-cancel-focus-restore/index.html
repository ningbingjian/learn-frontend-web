<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP127 dialog cancel 与焦点恢复</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
    dialog { border: 0; border-radius: 12px; padding: 24px; }
    dialog::backdrop { background: rgb(0 0 0 / .35); }
    pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>取消请求与焦点恢复</h1>
  <button id="open" type="button">打开设置</button>

  <dialog id="settings" aria-labelledby="settings-title">
    <h2 id="settings-title">设置</h2>
    <label><input id="block-escape" type="checkbox"> 教学实验：阻止 Esc 关闭</label>
    <p><button id="done" type="button" autofocus>完成</button></p>
  </dialog>

  <h2>事件日志</h2>
  <pre id="log">尚无事件。</pre>

  <script>
    const dialog = document.querySelector('#settings');
    const openButton = document.querySelector('#open');
    const blockEscape = document.querySelector('#block-escape');
    const log = document.querySelector('#log');
    let lastInvoker = null;

    function write(message) {
      log.textContent += `\n${message}`;
    }

    openButton.addEventListener('click', event => {
      lastInvoker = event.currentTarget;
      dialog.showModal();
      write('showModal(): 已打开');
    });

    dialog.addEventListener('cancel', event => {
      write(`cancel: defaultPrevented(before)=${event.defaultPrevented}`);
      if (blockEscape.checked) {
        event.preventDefault();
        write('cancel: 已 preventDefault，保持打开');
      }
    });

    dialog.addEventListener('close', () => {
      write(`close: returnValue=${dialog.returnValue || '(空)'}`);
      lastInvoker?.focus();
      write(`焦点恢复到: ${document.activeElement.id}`);
    });

    document.querySelector('#done').addEventListener('click', () => dialog.close('done'));
  </script>
</body>
</html>
