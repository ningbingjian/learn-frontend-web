<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP130 popover vs dialog</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
    [popover], dialog { padding: 18px; border: 1px solid #777; border-radius: 10px; }
    dialog::backdrop { background: rgb(0 0 0 / .4); }
    button { margin: 4px; }
  </style>
</head>
<body>
  <h1>Popover 与 Modal Dialog</h1>

  <button popovertarget="help" type="button">什么是归档？</button>
  <div id="help" popover>归档不会删除数据，之后可以恢复。</div>

  <button id="delete" type="button">删除项目</button>
  <button id="background" type="button">背景操作</button>
  <p id="status">背景点击：0 次</p>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <h2 id="confirm-title">确认删除？</h2>
    <p>此操作不可恢复。</p>
    <button id="cancel" type="button" autofocus>取消</button>
    <button id="confirm" type="button">确认</button>
  </dialog>

  <script>
    const dialog = document.querySelector('#confirm-dialog');
    const status = document.querySelector('#status');
    let count = 0;
    document.querySelector('#background').addEventListener('click', () => {
      count += 1;
      status.textContent = `背景点击：${count} 次`;
    });
    document.querySelector('#delete').addEventListener('click', () => dialog.showModal());
    document.querySelector('#cancel').addEventListener('click', () => dialog.close('cancel'));
    document.querySelector('#confirm').addEventListener('click', () => dialog.close('confirm'));
    dialog.addEventListener('close', () => {
      status.textContent = `dialog 结果：${dialog.returnValue}；背景点击累计：${count} 次`;
    });
  </script>
</body>
</html>
