<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP129 popover invoker</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
    [popover] { padding: 18px; border: 1px solid #777; border-radius: 10px; }
    button { margin: 4px; }
    pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>声明式 Popover Invoker</h1>
  <button popovertarget="course-help" type="button">默认 toggle</button>
  <button popovertarget="course-help" popovertargetaction="show" type="button">只显示</button>
  <button popovertarget="course-help" popovertargetaction="hide" type="button">只隐藏</button>

  <div id="course-help" popover>
    <strong>课程帮助</strong>
    <p>核心开关行为完全由 HTML 声明。</p>
  </div>

  <pre id="log">等待状态变化。</pre>
  <script>
    const popover = document.querySelector('#course-help');
    const log = document.querySelector('#log');
    popover.addEventListener('beforetoggle', event => {
      log.textContent = `beforetoggle: ${event.oldState} → ${event.newState}`;
    });
    popover.addEventListener('toggle', event => {
      log.textContent += `\ntoggle: ${event.oldState} → ${event.newState}`;
    });
  </script>
</body>
</html>
