<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP120 details 内容模型</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    details { margin: 16px 0; padding: 12px 16px; border: 1px solid #bbb; border-radius: 8px; }
    summary { cursor: pointer; font-weight: 700; }
    pre { padding: 12px; background: #f5f5f5; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>原生披露组件</h1>

  <details id="requirements">
    <summary>查看系统要求</summary>
    <ul>
      <li>现代浏览器</li>
      <li>启用 JavaScript 仅用于观察日志</li>
    </ul>
  </details>

  <details id="schedule" open>
    <summary>本周安排</summary>
    <p>周一学习 details，周二做复盘。</p>
  </details>

  <h2>状态日志</h2>
  <pre id="log">切换任意 details 查看状态。</pre>

  <script>
    const log = document.querySelector('#log');
    for (const item of document.querySelectorAll('details')) {
      item.addEventListener('toggle', () => {
        log.textContent = `${item.id}: open=${item.open}, hasAttribute(open)=${item.hasAttribute('open')}`;
      });
    }
  </script>
</body>
</html>
