<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP121 details 合适场景</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    .critical { padding: 16px; border: 2px solid #555; }
    details { margin: 12px 0; padding: 10px 14px; border: 1px solid #bbb; border-radius: 8px; }
    summary { cursor: pointer; font-weight: 700; }
  </style>
</head>
<body>
  <h1>前端架构课程</h1>

  <section class="critical" aria-labelledby="decision-title">
    <h2 id="decision-title">报名关键信息</h2>
    <p><strong>价格：¥1999</strong></p>
    <p>报名后 7 天内可申请退款。</p>
  </section>

  <h2>常见问题</h2>
  <details>
    <summary>课程需要什么基础？</summary>
    <p>会基本 HTML、CSS 和 JavaScript 即可。</p>
  </details>
  <details>
    <summary>是否提供源码？</summary>
    <p>每节都有独立案例源码。</p>
  </details>

  <p id="status">当前展开：0 项</p>
  <script>
    const items = [...document.querySelectorAll('details')];
    const status = document.querySelector('#status');
    function updateStatus() {
      status.textContent = `当前展开：${items.filter(item => item.open).length} 项`;
    }
    items.forEach(item => item.addEventListener('toggle', updateStatus));
    updateStatus();
  </script>
</body>
</html>
