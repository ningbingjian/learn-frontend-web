<!doctype html>
<!--
  KP036：br 与 hr
  br 用于内容内部强制换行；hr 用于主题切换；视觉间距交给 CSS。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>KP036：br 与 hr</title>
  <style>
    .article { margin-block: 2rem; }
    hr {
      border: 0;
      height: 8px;
      background: currentColor;
      opacity: 0.15;
      margin-block: 2rem;
    }
  </style>
</head>
<body>
  <h1>联系我们</h1>

  <address>
    Example Studio<br>
    88 Web Road<br>
    Shanghai
  </address>

  <section class="article">
    <p>第一部分介绍项目当前遇到的问题。</p>
    <p>问题主要集中在加载速度和资源体积。</p>
  </section>

  <hr>

  <section class="article">
    <p>第二部分开始讨论优化方案。</p>
    <p>优先处理首屏关键资源和缓存策略。</p>
  </section>
</body>
</html>
