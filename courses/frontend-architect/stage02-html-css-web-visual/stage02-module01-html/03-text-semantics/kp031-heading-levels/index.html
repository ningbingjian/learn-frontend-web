<!doctype html>
<!--
  KP031：h1～h6 标题层级
  核心：标题数字表达内容层级，不表达视觉字号。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>KP031：h1～h6 标题层级</title>
  <style>
    h2 { font-size: 16px; }
    h3 { font-size: 24px; }
  </style>
</head>
<body>
  <h1>前端性能手册</h1>

  <h2>加载性能</h2>
  <p>介绍资源加载阶段的性能问题。</p>

  <h3>关键资源</h3>
  <p>识别首屏真正需要的资源。</p>

  <h3>缓存策略</h3>
  <p>减少重复网络传输。</p>

  <h2>运行时性能</h2>
  <p>介绍页面运行阶段的性能问题。</p>

  <pre id="result"></pre>

  <script>
    const headings = document.querySelectorAll('h1, h2, h3, h4, h5, h6');
    document.querySelector('#result').textContent = Array.from(
      headings,
      heading => heading.tagName.toLowerCase() + ' -> ' + heading.textContent
    ).join('\n');
  </script>
</body>
</html>
