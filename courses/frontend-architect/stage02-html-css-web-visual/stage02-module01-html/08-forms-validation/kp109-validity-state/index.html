<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP109 ValidityState</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.6; }
    main { max-width: 760px; margin: 0 auto; }
    form, label { display: grid; gap: .75rem; }
    form { padding: 1rem; border: 1px solid #bbb; border-radius: .5rem; }
    input, button { padding: .55rem; font: inherit; }
    .actions { display: flex; gap: .5rem; flex-wrap: wrap; }
    pre { padding: 1rem; border: 1px solid #bbb; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>ValidityState 实验</h1>

    <form id="form" novalidate>
      <label>
        用户名（不能包含 admin）
        <input id="username" name="username" required minlength="3" value="admin-user">
      </label>

      <label>
        邮箱
        <input id="email" name="email" type="email" required value="not-an-email">
      </label>

      <label>
        年龄（18～60）
        <input id="age" name="age" type="number" min="18" max="60" value="16">
      </label>

      <div class="actions">
        <button type="button" id="check">checkValidity()</button>
        <button type="button" id="report">reportValidity()</button>
      </div>
    </form>

    <h2>状态</h2>
    <pre id="state"></pre>

    <h2>日志</h2>
    <pre id="log">点击按钮进行检查。</pre>
  </main>

  <script>
    const form = document.querySelector('#form');
    const username = document.querySelector('#username');
    const email = document.querySelector('#email');
    const age = document.querySelector('#age');
    const state = document.querySelector('#state');
    const log = document.querySelector('#log');

    function applyCustomRule() {
      username.setCustomValidity('');

      if (username.value.toLowerCase().includes('admin')) {
        username.setCustomValidity('用户名不能包含 admin');
      }
    }

    function snapshot(input) {
      const v = input.validity;
      return {
        value: input.value,
        valid: v.valid,
        valueMissing: v.valueMissing,
        typeMismatch: v.typeMismatch,
        tooShort: v.tooShort,
        rangeUnderflow: v.rangeUnderflow,
        rangeOverflow: v.rangeOverflow,
        stepMismatch: v.stepMismatch,
        customError: v.customError,
        willValidate: input.willValidate,
        validationMessage: input.validationMessage
      };
    }

    function render() {
      state.textContent = JSON.stringify({
        username: snapshot(username),
        email: snapshot(email),
        age: snapshot(age)
      }, null, 2);
    }

    [username, email, age].forEach(input => {
      input.addEventListener('input', () => {
        applyCustomRule();
        render();
      });
    });

    form.addEventListener('invalid', event => {
      log.textContent = `invalid：${event.target.name}\n${event.target.validationMessage}`;
    }, true);

    document.querySelector('#check').addEventListener('click', () => {
      applyCustomRule();
      const result = form.checkValidity();
      log.textContent = `checkValidity() => ${result}`;
      render();
    });

    document.querySelector('#report').addEventListener('click', () => {
      applyCustomRule();
      const result = form.reportValidity();
      log.textContent = `reportValidity() => ${result}`;
      render();
    });

    applyCustomRule();
    render();
  </script>
</body>
</html>
