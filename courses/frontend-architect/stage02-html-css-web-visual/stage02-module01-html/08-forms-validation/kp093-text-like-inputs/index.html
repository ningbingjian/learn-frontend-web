<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP093 text-like inputs</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    form { display: grid; gap: 12px; padding: 18px; border: 1px solid #bbb; border-radius: 10px; }
    label { display: grid; gap: 4px; }
    input, button { font: inherit; padding: 8px; }
    button { width: max-content; }
    pre { padding: 14px; border: 1px solid #bbb; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>比较 text、search、email、url、tel</h1>

  <form id="contact-form">
    <label>
      姓名（text）
      <input type="text" name="fullName" autocomplete="name" value="Alice">
    </label>
    <label>
      搜索词（search）
      <input type="search" name="keyword" autocomplete="off" value="HTML forms">
    </label>
    <label>
      邮箱（email，故意先填错）
      <input type="email" name="email" autocomplete="email" value="alice.example.com">
    </label>
    <label>
      网站（url，故意先省略协议）
      <input type="url" name="website" autocomplete="url" value="example.com">
    </label>
    <label>
      电话（tel）
      <input type="tel" name="phone" autocomplete="tel" value="138-0013-8000">
    </label>
    <button type="button" id="inspect">检查类型与 validity</button>
  </form>

  <h2>检查结果</h2>
  <pre id="result">点击按钮观察结果。</pre>

  <script>
    const form = document.querySelector('#contact-form');
    const result = document.querySelector('#result');

    document.querySelector('#inspect').addEventListener('click', () => {
      const inputs = [...form.querySelectorAll('input')];
      const rows = inputs.map(input => ({
        name: input.name,
        type: input.type,
        value: input.value,
        valid: input.validity.valid,
        typeMismatch: input.validity.typeMismatch,
        autocomplete: input.autocomplete,
        inputMode: input.inputMode || '(browser default)'
      }));

      result.textContent = rows.map(row => JSON.stringify(row)).join('\n');
    });
  </script>
</body>
</html>
