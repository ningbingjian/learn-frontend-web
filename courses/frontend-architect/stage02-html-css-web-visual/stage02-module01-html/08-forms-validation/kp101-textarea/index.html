<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP101 textarea 多行文本</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.6; }
    form { max-width: 42rem; display: grid; gap: .75rem; }
    textarea { width: 100%; box-sizing: border-box; padding: .75rem; }
    .actions { display: flex; gap: .75rem; flex-wrap: wrap; }
    output { display: block; white-space: pre-wrap; padding: 1rem; background: #f4f4f4; border-radius: .5rem; }
  </style>
</head>
<body>
  <h1>KP101：textarea 多行文本</h1>

  <form id="profile-form">
    <label for="bio">个人简介（最多 120 字符）</label>
    <textarea id="bio" name="bio" rows="5" cols="36" maxlength="120">第一行：HTML 学习记录
第二行：继续完善表单知识</textarea>

    <div class="actions">
      <button type="button" id="inspect">检查当前状态</button>
      <button type="reset">恢复初始值</button>
    </div>
  </form>

  <h2>实验输出</h2>
  <output id="result"></output>

  <script>
    const form = document.querySelector('#profile-form');
    const textarea = document.querySelector('#bio');
    const result = document.querySelector('#result');

    function render() {
      const data = new FormData(form);
      const lineCount = textarea.value === ''
        ? 0
        : textarea.value.split(/\r\n|\r|\n/).length;

      result.textContent = [
        `当前 value: ${JSON.stringify(textarea.value)}`,
        `defaultValue: ${JSON.stringify(textarea.defaultValue)}`,
        `当前长度: ${textarea.value.length}`,
        `当前行数: ${lineCount}`,
        `maxlength: ${textarea.maxLength}`,
        `validity.tooLong: ${textarea.validity.tooLong}`,
        `FormData.get("bio"): ${JSON.stringify(data.get('bio'))}`
      ].join('\n');
    }

    document.querySelector('#inspect').addEventListener('click', render);
    form.addEventListener('reset', () => setTimeout(render));
    render();
  </script>
</body>
</html>
