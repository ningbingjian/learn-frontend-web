<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP110 字段错误</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.6; }
    main { max-width: 720px; margin: 0 auto; }
    form, .field { display: grid; gap: .55rem; }
    form { gap: 1rem; }
    input, button { padding: .55rem; font: inherit; }
    [aria-invalid="true"] { outline: 2px solid currentColor; }
    .error { font-weight: 700; }
    #error-summary { padding: 1rem; border: 2px solid currentColor; margin-bottom: 1rem; }
    pre { padding: 1rem; border: 1px solid #bbb; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>字段错误实验</h1>

    <div id="error-summary" role="alert" hidden>
      <h2 id="summary-title"></h2>
      <ul id="summary-list"></ul>
    </div>

    <form id="form" novalidate>
      <div class="field">
        <label for="name">姓名</label>
        <input id="name" name="name" required minlength="2" aria-describedby="name-help name-error">
        <p id="name-help">至少 2 个字符。</p>
        <p id="name-error" class="error" hidden></p>
      </div>

      <div class="field">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" required aria-describedby="email-help email-error">
        <p id="email-help">用于接收课程通知。</p>
        <p id="email-error" class="error" hidden></p>
      </div>

      <button type="submit">提交</button>
    </form>

    <h2>焦点日志</h2>
    <pre id="log">尚未提交。</pre>
  </main>

  <script>
    const form = document.querySelector('#form');
    const inputs = [...form.querySelectorAll('input')];
    const summary = document.querySelector('#error-summary');
    const summaryTitle = document.querySelector('#summary-title');
    const summaryList = document.querySelector('#summary-list');
    const log = document.querySelector('#log');
    let attemptedSubmit = false;

    function messageFor(input) {
      if (input.validity.valueMissing) {
        return input.name === 'email' ? '请输入邮箱地址。' : '请输入姓名。';
      }
      if (input.validity.typeMismatch) {
        return '请输入有效的邮箱地址。';
      }
      if (input.validity.tooShort) {
        return `姓名至少需要 ${input.minLength} 个字符。`;
      }
      return '';
    }

    function validateField(input) {
      const error = document.querySelector(`#${input.id}-error`);
      const message = messageFor(input);

      if (message) {
        input.setAttribute('aria-invalid', 'true');
        error.textContent = message;
        error.hidden = false;
        return { input, message };
      }

      input.removeAttribute('aria-invalid');
      error.textContent = '';
      error.hidden = true;
      return null;
    }

    function renderSummary(errors) {
      summaryList.replaceChildren();
      summary.hidden = errors.length === 0;

      if (errors.length === 0) return;

      summaryTitle.textContent = `请修正以下 ${errors.length} 个问题`;

      errors.forEach(({ input, message }) => {
        const item = document.createElement('li');
        const link = document.createElement('a');
        link.href = `#${input.id}`;
        link.textContent = `${input.labels[0]?.textContent || input.name}：${message}`;
        link.addEventListener('click', event => {
          event.preventDefault();
          input.focus();
        });
        item.append(link);
        summaryList.append(item);
      });
    }

    function validateForm() {
      const errors = inputs.map(validateField).filter(Boolean);
      renderSummary(errors);
      return errors;
    }

    inputs.forEach(input => {
      input.addEventListener('input', () => {
        if (!attemptedSubmit) return;
        const errors = validateForm();
        log.textContent = errors.length
          ? `仍有 ${errors.length} 个错误。`
          : '当前字段错误已全部修正。';
      });
    });

    form.addEventListener('submit', event => {
      event.preventDefault();
      attemptedSubmit = true;
      const errors = validateForm();

      if (errors.length > 0) {
        errors[0].input.focus();
        log.textContent = `提交失败，焦点已移动到第一个错误字段：${errors[0].input.name}`;
        return;
      }

      log.textContent = '客户端字段校验通过，可以进入真正的提交请求。';
    });
  </script>
</body>
</html>
