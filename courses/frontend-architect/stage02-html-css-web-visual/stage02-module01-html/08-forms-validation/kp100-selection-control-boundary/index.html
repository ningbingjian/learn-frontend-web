<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP100 选择控件的选型边界</title>
  <style>
    body { max-width: 800px; margin: 40px auto; padding: 0 20px; font-family: system-ui, sans-serif; line-height: 1.7; }
    fieldset { margin: 18px 0; padding: 16px; }
    label { display: block; margin: 7px 0; }
    select { min-width: 220px; padding: 7px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    pre { background: #f4f4f4; padding: 14px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>选择控件的选型边界</h1>

  <form id="demo-form">
    <div class="grid">
      <fieldset>
        <legend>账单周期：少量互斥选项 → radio</legend>
        <label><input type="radio" name="billing" value="monthly" checked> 月付</label>
        <label><input type="radio" name="billing" value="yearly"> 年付</label>
      </fieldset>

      <fieldset>
        <legend>国家 / 地区：较长单选枚举 → select</legend>
        <label for="country">国家 / 地区</label>
        <select id="country" name="country">
          <option value="CN">中国</option>
          <option value="SG">新加坡</option>
          <option value="JP">日本</option>
          <option value="US">美国</option>
          <option value="DE">德国</option>
          <option value="FR">法国</option>
        </select>
      </fieldset>
    </div>

    <div class="grid">
      <fieldset>
        <legend>技能：少量多选 → checkbox</legend>
        <label><input type="checkbox" name="skill" value="html" checked> HTML</label>
        <label><input type="checkbox" name="skill" value="css"> CSS</label>
        <label><input type="checkbox" name="skill" value="javascript"> JavaScript</label>
        <label><input type="checkbox" name="skill" value="typescript"> TypeScript</label>
      </fieldset>

      <fieldset>
        <legend>紧凑多选对照 → multiple select</legend>
        <label for="compact-skills">技能</label>
        <select id="compact-skills" name="compactSkill" multiple size="4">
          <option value="html" selected>HTML</option>
          <option value="css">CSS</option>
          <option value="javascript">JavaScript</option>
          <option value="typescript">TypeScript</option>
        </select>
      </fieldset>
    </div>
  </form>

  <pre id="result"></pre>

  <script>
    const form = document.querySelector('#demo-form');
    const result = document.querySelector('#result');

    function inspect() {
      const data = new FormData(form);
      result.textContent = JSON.stringify({
        billing: data.get('billing'),
        country: data.get('country'),
        checkboxSkills: data.getAll('skill'),
        multipleSelectSkills: data.getAll('compactSkill'),
        controlCounts: {
          radios: form.querySelectorAll('input[type="radio"]').length,
          checkboxes: form.querySelectorAll('input[type="checkbox"]').length,
          selects: form.querySelectorAll('select').length
        }
      }, null, 2);
    }

    form.addEventListener('change', inspect);
    inspect();
  </script>
</body>
</html>
