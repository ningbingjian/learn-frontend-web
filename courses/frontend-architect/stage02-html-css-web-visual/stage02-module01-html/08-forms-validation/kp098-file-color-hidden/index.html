<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP098 file、color、hidden</title>
  <style>
    body { max-width: 760px; margin: 40px auto; padding: 0 20px; font-family: system-ui, sans-serif; line-height: 1.7; }
    label { display: block; margin: 14px 0 6px; }
    button { margin: 10px 8px 10px 0; padding: 8px 12px; }
    pre { background: #f4f4f4; padding: 14px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>file、color、hidden</h1>

  <form id="demo-form" enctype="multipart/form-data">
    <label for="avatar">选择头像（PNG / JPEG 提示）</label>
    <input id="avatar" name="avatar" type="file" accept="image/png,image/jpeg">

    <label for="theme-color">主题色</label>
    <input id="theme-color" name="themeColor" type="color" value="#3366ff">

    <input id="source" type="hidden" name="source" value="kp098-demo">
  </form>

  <p>
    <button id="modify-hidden" type="button">修改 hidden 值</button>
    <button id="reset-hidden" type="button">恢复 hidden 值</button>
  </p>

  <pre id="result"></pre>

  <script>
    const form = document.querySelector('#demo-form');
    const avatar = document.querySelector('#avatar');
    const hidden = document.querySelector('#source');
    const result = document.querySelector('#result');

    function inspect() {
      const file = avatar.files[0];
      const data = new FormData(form);

      result.textContent = JSON.stringify({
        file: file ? {
          name: file.name,
          type: file.type || '(empty MIME type)',
          size: file.size,
          lastModified: file.lastModified
        } : null,
        color: data.get('themeColor'),
        hiddenSource: data.get('source'),
        fileInputValueShownByBrowser: avatar.value
      }, null, 2);
    }

    form.addEventListener('change', inspect);
    document.querySelector('#modify-hidden').addEventListener('click', () => {
      hidden.value = 'modified-by-script';
      inspect();
    });
    document.querySelector('#reset-hidden').addEventListener('click', () => {
      hidden.value = 'kp098-demo';
      inspect();
    });

    inspect();
  </script>
</body>
</html>
