<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP105 帮助文本</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.6; }
    form { max-width: 40rem; display: grid; gap: .5rem; }
    input { padding: .65rem; }
    .help { margin: 0; font-size: .95rem; }
    output { display: block; white-space: pre-wrap; margin-top: 1rem; padding: 1rem; background: #f4f4f4; border-radius: .5rem; }
  </style>
</head>
<body>
  <h1>KP105：帮助文本与 aria-describedby</h1>

  <form>
    <label for="username">用户名</label>
    <input
      id="username"
      name="username"
      placeholder="例如 nick_2026"
      aria-describedby="username-help username-format"
    >
    <p id="username-help" class="help">用于公开个人主页，不要填写邮箱地址。</p>
    <p id="username-format" class="help">4～20 个字符，可使用字母、数字和下划线。</p>

    <button type="button" id="inspect">检查描述关联</button>
  </form>

  <h2>实验输出</h2>
  <output id="result"></output>

  <script>
    const input = document.querySelector('#username');
    const result = document.querySelector('#result');

    function render() {
      const raw = input.getAttribute('aria-describedby') ?? '';
      const ids = raw.trim() ? raw.trim().split(/\s+/) : [];
      const resolved = ids.map(id => {
        const node = document.getElementById(id);
        return { id, exists: Boolean(node), text: node?.textContent.trim() ?? null };
      });

      result.textContent = [
        `aria-describedby: ${JSON.stringify(raw)}`,
        `引用 ID: ${JSON.stringify(ids)}`,
        `解析结果: ${JSON.stringify(resolved, null, 2)}`,
        `placeholder: ${JSON.stringify(input.placeholder)}`
      ].join('\n');
    }

    document.querySelector('#inspect').addEventListener('click', render);
    render();
  </script>
</body>
</html>
