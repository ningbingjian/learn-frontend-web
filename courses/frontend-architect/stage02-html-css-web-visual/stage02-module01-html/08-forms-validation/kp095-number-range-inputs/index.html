<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP095 number 与 range</title>
  <style>
    body { max-width: 760px; margin: 40px auto; padding: 0 20px; font-family: system-ui, sans-serif; line-height: 1.6; }
    fieldset { margin: 20px 0; padding: 18px; }
    label { display: block; margin: 12px 0 6px; }
    input { padding: 8px; }
    input[type="range"] { width: min(100%, 420px); }
    pre { padding: 14px; background: #f4f4f4; white-space: pre-wrap; }
    .note { padding: 12px; border-left: 4px solid currentColor; }
  </style>
</head>
<body>
  <h1>number 与 range</h1>

  <fieldset>
    <legend>真正的数值</legend>
    <label for="score">评分（0～10，步长 0.5）</label>
    <input id="score" name="score" type="number" min="0" max="10" step="0.5" value="7.5">

    <label for="volume">音量：<output id="volume-value" for="volume">40</output></label>
    <input id="volume" name="volume" type="range" min="0" max="100" step="5" value="40">
  </fieldset>

  <fieldset>
    <legend>看起来像数字，但本质是文本</legend>
    <label for="phone">手机号 / 编号示例</label>
    <input id="phone" name="phone" type="text" inputmode="numeric" value="0013800138000">
    <p class="note">手机号不参与数学运算，前导 0 也可能有意义，因此这里不使用 type="number"。</p>
  </fieldset>

  <h2>评分输入状态</h2>
  <pre id="result"></pre>

  <script>
    const score = document.querySelector('#score');
    const volume = document.querySelector('#volume');
    const volumeValue = document.querySelector('#volume-value');
    const result = document.querySelector('#result');

    function inspectScore() {
      result.textContent = JSON.stringify({
        value: score.value,
        valueAsNumber: Number.isNaN(score.valueAsNumber) ? 'NaN' : score.valueAsNumber,
        valid: score.validity.valid,
        rangeUnderflow: score.validity.rangeUnderflow,
        rangeOverflow: score.validity.rangeOverflow,
        stepMismatch: score.validity.stepMismatch
      }, null, 2);
    }

    score.addEventListener('input', inspectScore);
    volume.addEventListener('input', () => {
      volumeValue.value = volume.value;
    });

    inspectScore();
  </script>
</body>
</html>
