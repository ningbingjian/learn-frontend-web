<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP104 label</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.6; }
    form { max-width: 36rem; display: grid; gap: 1rem; }
    .field { display: grid; gap: .35rem; }
    input { padding: .65rem; }
    output { display: block; white-space: pre-wrap; padding: 1rem; background: #f4f4f4; border-radius: .5rem; }
  </style>
</head>
<body>
  <h1>KP104：label 标签关联</h1>

  <form id="demo-form">
    <div class="field">
      <label id="email-label" for="email">邮箱地址</label>
      <input id="email" name="email" type="email" placeholder="name@example.com">
    </div>

    <label id="nickname-label" class="field">
      昵称
      <input id="nickname" name="nickname" type="text">
    </label>

    <button type="button" id="inspect">检查标签关联</button>
  </form>

  <h2>实验输出</h2>
  <output id="result"></output>

  <script>
    const email = document.querySelector('#email');
    const nickname = document.querySelector('#nickname');
    const result = document.querySelector('#result');

    function labelTexts(control) {
      return [...(control.labels ?? [])].map(label => label.textContent.trim().replace(/\s+/g, ' '));
    }

    function render(prefix = '状态') {
      result.textContent = [
        `${prefix}`,
        `email.labels: ${JSON.stringify(labelTexts(email))}`,
        `nickname.labels: ${JSON.stringify(labelTexts(nickname))}`,
        `document.activeElement.id: ${document.activeElement.id || '(none)'}`
      ].join('\n');
    }

    document.querySelector('#inspect').addEventListener('click', () => render('手动检查'));

    for (const label of document.querySelectorAll('label')) {
      label.addEventListener('click', () => {
        setTimeout(() => render(`点击 label #${label.id}`));
      });
    }

    render();
  </script>
</body>
</html>
