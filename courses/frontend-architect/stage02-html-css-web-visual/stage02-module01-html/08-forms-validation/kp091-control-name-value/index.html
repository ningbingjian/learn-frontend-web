<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP091 name 与 value</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    form { display: grid; gap: 14px; padding: 18px; border: 1px solid #bbb; border-radius: 10px; }
    label { display: block; }
    input[type="text"] { display: block; width: min(100%, 420px); box-sizing: border-box; font: inherit; padding: 8px; }
    fieldset { display: grid; gap: 8px; }
    button { width: max-content; font: inherit; padding: 8px 12px; }
    pre { padding: 14px; border: 1px solid #bbb; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>观察 name 与 value</h1>

  <form id="profile-form">
    <label>
      用户名
      <input id="username" type="text" name="username" value="alice">
    </label>

    <label>
      页面备注（故意没有 name）
      <input id="ui-note" type="text" value="只在前端使用">
    </label>

    <fieldset>
      <legend>技能</legend>
      <label><input type="checkbox" name="skill" value="html" checked> HTML</label>
      <label><input type="checkbox" name="skill" value="css" checked> CSS</label>
      <label><input type="checkbox" name="skill" value="js"> JavaScript</label>
    </fieldset>

    <button type="button" id="inspect">检查 FormData</button>
  </form>

  <h2>当前成功控件</h2>
  <pre id="result">点击按钮观察数据。</pre>

  <script>
    const form = document.querySelector('#profile-form');
    const result = document.querySelector('#result');

    document.querySelector('#inspect').addEventListener('click', () => {
      const data = new FormData(form);
      const entries = [...data.entries()];
      const allSkills = data.getAll('skill');

      result.textContent = [
        `entries: ${JSON.stringify(entries)}`,
        `skill.getAll(): ${JSON.stringify(allSkills)}`,
        `是否包含 ui-note: ${data.has('ui-note')}`
      ].join('\n');
    });
  </script>
</body>
</html>
