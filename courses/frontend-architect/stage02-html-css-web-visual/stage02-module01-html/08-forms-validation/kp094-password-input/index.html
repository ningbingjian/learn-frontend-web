<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP094 password 输入框</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    form { display: grid; gap: 16px; padding: 18px; border: 1px solid #bbb; border-radius: 10px; }
    .field { display: grid; gap: 6px; }
    input, button { font: inherit; padding: 8px; }
    button { width: max-content; }
    pre { padding: 14px; border: 1px solid #bbb; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>观察 password 输入框</h1>

  <form id="password-form">
    <div class="field">
      <label for="current-password">当前密码</label>
      <input
        id="current-password"
        type="password"
        name="currentPassword"
        autocomplete="current-password"
        minlength="8"
        value="secret123"
      >
      <button type="button" class="toggle-password" data-target="current-password" aria-pressed="false">显示当前密码</button>
    </div>

    <div class="field">
      <label for="new-password">新密码</label>
      <input
        id="new-password"
        type="password"
        name="newPassword"
        autocomplete="new-password"
        minlength="12"
        value="new-secret-123"
      >
      <button type="button" class="toggle-password" data-target="new-password" aria-pressed="false">显示新密码</button>
    </div>

    <button type="button" id="inspect">检查密码字段状态</button>
  </form>

  <h2>安全的观察结果</h2>
  <pre id="result">这里只输出类型、长度和 validity，不输出密码原文。</pre>

  <script>
    const form = document.querySelector('#password-form');
    const result = document.querySelector('#result');

    for (const button of document.querySelectorAll('.toggle-password')) {
      button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.target);
        const showing = input.type === 'text';

        input.type = showing ? 'password' : 'text';
        button.setAttribute('aria-pressed', String(!showing));
        button.textContent = showing
          ? `显示${input.id === 'current-password' ? '当前' : '新'}密码`
          : `隐藏${input.id === 'current-password' ? '当前' : '新'}密码`;
        input.focus();
      });
    }

    document.querySelector('#inspect').addEventListener('click', () => {
      const passwordInputs = [
        document.querySelector('#current-password'),
        document.querySelector('#new-password')
      ];

      result.textContent = passwordInputs.map(input => JSON.stringify({
        name: input.name,
        displayedType: input.type,
        autocomplete: input.autocomplete,
        length: input.value.length,
        tooShort: input.validity.tooShort,
        valid: input.validity.valid
      })).join('\n');
    });
  </script>
</body>
</html>
