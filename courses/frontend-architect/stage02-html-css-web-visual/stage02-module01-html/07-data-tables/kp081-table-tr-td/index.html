<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP081 - table、tr、td</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.6; margin: 2rem; }
    table { border-collapse: collapse; }
    td { border: 1px solid #888; padding: 0.5rem 0.75rem; }
    pre { padding: 0.75rem; border: 1px solid #bbb; max-width: 32rem; }
  </style>
</head>
<body>
  <main>
    <h1>商品库存</h1>
    <p>下面三行数据组成一个规则的三列表格。</p>

    <table id="inventory-table">
      <tr>
        <td>键盘</td>
        <td>299 元</td>
        <td>有货</td>
      </tr>
      <tr>
        <td>鼠标</td>
        <td>159 元</td>
        <td>有货</td>
      </tr>
      <tr>
        <td>显示器</td>
        <td>1299 元</td>
        <td>缺货</td>
      </tr>
    </table>

    <h2>DOM 检查</h2>
    <pre id="inspection"></pre>
  </main>

  <script>
    const rows = [...document.querySelectorAll('#inventory-table tr')];
    const report = rows.map((row, index) => {
      return `第 ${index + 1} 行：${row.cells.length} 个单元格`;
    });

    document.querySelector('#inspection').textContent = report.join('\n');
  </script>
</body>
</html>
