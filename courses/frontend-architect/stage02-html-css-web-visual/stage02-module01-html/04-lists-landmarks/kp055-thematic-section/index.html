<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP055 section 主题分区</title>
  <style>
    body { font-family: sans-serif; line-height: 1.7; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    section, .actions { margin: 20px 0; padding: 16px; border: 1px solid #bbb; }
    section section { margin-left: 24px; }
    .actions { display: flex; gap: 12px; }
    pre { padding: 16px; border: 1px dashed #999; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>前端架构师课程</h1>

    <section>
      <h2>课程简介</h2>
      <p>本课程从 Web 基础逐步进入工程化与架构设计。</p>
    </section>

    <section>
      <h2>课程大纲</h2>

      <section>
        <h3>HTML</h3>
        <p>学习结构、语义和原生平台能力。</p>
      </section>

      <section>
        <h3>CSS</h3>
        <p>学习布局、响应式和视觉系统。</p>
      </section>
    </section>

    <div class="actions">
      <button type="button">收藏</button>
      <button type="button">开始学习</button>
    </div>
  </main>

  <h2>section 结构观察</h2>
  <pre id="output"></pre>

  <script>
    const lines = [...document.querySelectorAll('section')].map((section, index) => {
      const directHeading = [...section.children].find((child) => /^H[1-6]$/.test(child.tagName));
      const parentSection = section.parentElement?.closest('section');
      return `section ${index + 1}: heading=${directHeading?.textContent || 'none'}, parent=${parentSection ? 'section' : 'none'}`;
    });
    document.querySelector('#output').textContent = lines.join('\n');
  </script>
</body>
</html>
