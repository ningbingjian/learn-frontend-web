<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP047 - dl dt dd 描述列表</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; line-height: 1.7; }
    dl { display: grid; grid-template-columns: 10rem 1fr; gap: 8px 18px; padding: 18px; border: 1px solid #bbb; border-radius: 10px; }
    dt { font-weight: 700; }
    dd { margin: 0; }
    .wide { grid-column: 2; }
    pre { background: #f4f4f4; padding: 12px; }
  </style>
</head>
<body>
  <h1>课程元数据与术语</h1>

  <dl id="course-meta">
    <dt>课程名称</dt>
    <dd>HTML 语义基础</dd>

    <dt>学习阶段</dt>
    <dd>Stage 02</dd>

    <dt>HTML</dt>
    <dd>负责页面结构。</dd>
    <dd class="wide">强调内容语义，而不是只负责视觉样式。</dd>

    <dt>JS</dt>
    <dt>JavaScript</dt>
    <dd>浏览器前端开发的核心编程语言之一。</dd>
  </dl>

  <h2>结构观察</h2>
  <pre id="result"></pre>

  <script>
    const list = document.querySelector('#course-meta');
    const terms = list.querySelectorAll('dt');
    const details = list.querySelectorAll('dd');

    document.querySelector('#result').textContent =
      `dt 数量：${terms.length}\ndd 数量：${details.length}`;
  </script>
</body>
</html>
