<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP052 aside 间接相关内容</title>
  <style>
    body { font-family: sans-serif; line-height: 1.7; max-width: 760px; margin: 40px auto; padding: 0 20px; }
    article, aside { margin: 20px 0; padding: 16px; border: 1px solid #bbb; }
    article aside { margin-left: 24px; }
    pre { padding: 16px; border: 1px dashed #999; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <article id="lesson">
      <h1>理解 CSS 盒模型</h1>
      <p>每个元素都可以看成一个盒子，内容、内边距、边框和外边距共同参与布局。</p>

      <aside aria-labelledby="term-title">
        <h2 id="term-title">术语补充</h2>
        <p>content box 指元素真正放置文本和子内容的区域。</p>
      </aside>

      <p>正文继续讲解盒模型尺寸计算。</p>
    </article>
  </main>

  <aside aria-labelledby="recommend-title">
    <h2 id="recommend-title">推荐阅读</h2>
    <ul>
      <li><a href="#">CSS display</a></li>
      <li><a href="#">CSS position</a></li>
    </ul>
  </aside>

  <h2>aside 上下文观察</h2>
  <pre id="output"></pre>

  <script>
    const lines = [...document.querySelectorAll('aside')].map((aside, index) => {
      const article = aside.closest('article');
      const inMain = Boolean(aside.closest('main'));
      return `aside ${index + 1}: article=${article?.id || 'none'}, inMain=${inMain}`;
    });
    document.querySelector('#output').textContent = lines.join('\n');
  </script>
</body>
</html>
