<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP049 - header 与 footer</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; line-height: 1.7; }
    header, footer, article { margin: 18px 0; padding: 16px; border: 1px solid #bbb; border-radius: 10px; }
    article header, article footer { border-style: dashed; }
    nav a { margin-right: 12px; }
    pre { background: #f4f4f4; padding: 12px; }
  </style>
</head>
<body>
  <header id="site-header">
    <p><strong>Frontend Learning Lab</strong></p>
    <nav aria-label="主导航">
      <a href="#article">文章</a>
      <a href="#site-footer">关于</a>
    </nav>
  </header>

  <main>
    <article id="article">
      <header class="article-header">
        <h1>语义化 HTML 为什么重要</h1>
        <p>作者：Frontend Team</p>
      </header>

      <p>语义标签描述内容角色，而不是只描述它看起来像什么。</p>

      <footer class="article-footer">
        <p>最后更新：2026-08-27</p>
      </footer>
    </article>
  </main>

  <footer id="site-footer">
    <p>© Frontend Learning Lab</p>
  </footer>

  <h2>上下文观察</h2>
  <pre id="result"></pre>

  <script>
    const headers = document.querySelectorAll('header');
    const footers = document.querySelectorAll('footer');
    const articleHeader = document.querySelector('.article-header');

    document.querySelector('#result').textContent = [
      `header 数量：${headers.length}`,
      `footer 数量：${footers.length}`,
      `文章 header 的父元素：${articleHeader.parentElement.tagName.toLowerCase()}`
    ].join('\n');
  </script>
</body>
</html>
