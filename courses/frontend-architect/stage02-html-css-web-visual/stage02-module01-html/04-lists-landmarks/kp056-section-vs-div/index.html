<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP056 section 与 div</title>
  <style>
    body { font-family: sans-serif; line-height: 1.7; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    section { margin: 24px 0; padding: 16px; border: 1px solid #999; }
    .feature-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .card { padding: 16px; border: 1px dashed #999; }
    pre { padding: 16px; border: 1px dashed #999; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>产品介绍</h1>

    <section aria-labelledby="features-title">
      <h2 id="features-title">产品功能</h2>
      <p>下面两张卡片只是这个章节内部的视觉布局。</p>
      <div class="feature-grid">
        <div class="card">实时协作</div>
        <div class="card">版本历史</div>
      </div>
    </section>

    <section aria-labelledby="faq-title">
      <h2 id="faq-title">常见问题</h2>
      <p>这里回答购买、部署和升级问题。</p>
    </section>
  </main>

  <h2>section / div 结构观察</h2>
  <pre id="output"></pre>

  <script>
    const sections = [...document.querySelectorAll('section')];
    const divs = [...document.querySelectorAll('div')];
    document.querySelector('#output').textContent = [
      `section count: ${sections.length}`,
      `div count: ${divs.length}`,
      ...sections.map((section) => `section label source: ${section.getAttribute('aria-labelledby') || 'none'}`),
    ].join('\n');
  </script>
</body>
</html>
