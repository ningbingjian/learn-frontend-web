<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP053 article 独立内容</title>
  <style>
    body { font-family: sans-serif; line-height: 1.7; max-width: 760px; margin: 40px auto; padding: 0 20px; }
    article, .metric-card { margin: 20px 0; padding: 16px; border: 1px solid #bbb; }
    .metric-card { display: flex; justify-content: space-between; }
    pre { padding: 16px; border: 1px dashed #999; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>前端文章精选</h1>

    <article>
      <header>
        <h2>理解 CSS Grid</h2>
        <p>作者：李雷</p>
      </header>
      <p>Grid 是一个二维布局系统，适合同时控制行和列。</p>
    </article>

    <article>
      <header>
        <h2>理解 Flexbox</h2>
        <p>作者：韩梅梅</p>
      </header>
      <p>Flexbox 更擅长沿一个主轴组织和分配空间。</p>
    </article>

    <div class="metric-card">
      <strong>本周新增文章</strong>
      <span>12</span>
    </div>
  </main>

  <h2>article 结构观察</h2>
  <pre id="output"></pre>

  <script>
    const lines = [...document.querySelectorAll('article')].map((article, index) => {
      const heading = article.querySelector('h1, h2, h3, h4, h5, h6');
      return `article ${index + 1}: ${heading?.textContent || '无标题'}`;
    });
    document.querySelector('#output').textContent = lines.join('\n');
  </script>
</body>
</html>
