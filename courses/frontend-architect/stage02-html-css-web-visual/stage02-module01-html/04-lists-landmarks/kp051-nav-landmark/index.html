<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP051 nav 导航地标</title>
  <style>
    body { font-family: sans-serif; line-height: 1.7; max-width: 760px; margin: 40px auto; padding: 0 20px; }
    nav, footer, section { margin: 20px 0; padding: 16px; border: 1px solid #bbb; }
    nav ul { display: flex; gap: 20px; padding-left: 20px; }
    pre { padding: 16px; border: 1px dashed #999; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>课程中心</h1>

  <nav aria-label="主导航">
    <ul>
      <li><a href="#frontend">前端</a></li>
      <li><a href="#backend">后端</a></li>
      <li><a href="#ai">AI</a></li>
    </ul>
  </nav>

  <section>
    <h2 id="toc-title">本文目录</h2>
    <nav aria-labelledby="toc-title">
      <a href="#overview">概览</a>
      <a href="#examples">案例</a>
    </nav>
  </section>

  <section id="overview">
    <h2>概览</h2>
    <p>一个页面可以有多个导航地标，但它们应该有可区分的名称。</p>
  </section>

  <section id="examples">
    <h2>案例</h2>
    <p>普通辅助链接组不必为了“有链接”而强行使用 nav。</p>
  </section>

  <footer>
    <p>
      <a href="#privacy">隐私政策</a>
      <a href="#terms">服务条款</a>
    </p>
  </footer>

  <h2>导航结构观察</h2>
  <pre id="output"></pre>

  <script>
    const navs = [...document.querySelectorAll('nav')];
    const lines = navs.map((nav, index) => {
      const labelledby = nav.getAttribute('aria-labelledby');
      const label = nav.getAttribute('aria-label')
        || (labelledby ? document.getElementById(labelledby)?.textContent : '')
        || '未命名';
      return `nav ${index + 1}: ${label}, links=${nav.querySelectorAll('a').length}`;
    });
    document.querySelector('#output').textContent = lines.join('\n');
  </script>
</body>
</html>
