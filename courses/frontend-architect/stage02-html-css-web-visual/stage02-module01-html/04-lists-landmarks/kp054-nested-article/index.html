<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP054 嵌套 article</title>
  <style>
    body { font-family: sans-serif; line-height: 1.7; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    article { margin: 20px 0; padding: 16px; border: 1px solid #bbb; }
    article article { margin-left: 24px; }
    pre { padding: 16px; border: 1px dashed #999; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>技术讨论区</h1>

    <article id="post">
      <h2>你更喜欢 Grid 还是 Flexbox？</h2>
      <p>我通常根据二维或一维布局需求来选择。</p>

      <article id="comment-1">
        <h3>张三的评论</h3>
        <p>复杂页面我更偏向 Grid。</p>

        <article id="reply-1">
          <h4>李四的回复</h4>
          <p>我也会用 Grid 做大结构，再用 Flexbox 处理局部组件。</p>
        </article>
      </article>

      <article id="comment-2">
        <h3>王五的评论</h3>
        <p>组件内部我更常用 Flexbox。</p>
      </article>
    </article>
  </main>

  <h2>文章嵌套观察</h2>
  <pre id="output"></pre>

  <script>
    const articles = [...document.querySelectorAll('article')];
    const lines = articles.map((article) => {
      let depth = 0;
      const parent = article.parentElement?.closest('article');
      let cursor = parent;
      while (cursor) {
        depth += 1;
        cursor = cursor.parentElement?.closest('article');
      }
      return `${article.id}: depth=${depth}, parent=${parent?.id || 'none'}`;
    });
    document.querySelector('#output').textContent = lines.join('\n');
  </script>
</body>
</html>
