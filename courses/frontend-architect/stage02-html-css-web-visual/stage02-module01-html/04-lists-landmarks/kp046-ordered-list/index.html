<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP046 - ol 有序列表</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 40px auto; padding: 0 20px; line-height: 1.7; }
    section { margin: 28px 0; padding: 16px; border: 1px solid #bbb; border-radius: 10px; }
    pre { background: #f4f4f4; padding: 12px; overflow: auto; }
  </style>
</head>
<body>
  <h1>`ol` 有序列表实验</h1>

  <section>
    <h2>默认步骤</h2>
    <ol id="release-steps">
      <li>构建产物</li>
      <li>上传测试环境</li>
      <li>执行验证</li>
    </ol>
  </section>

  <section>
    <h2>`start` 续接编号</h2>
    <ol start="4" id="continued-steps">
      <li>创建发布标签</li>
      <li>推送生产环境</li>
    </ol>
  </section>

  <section>
    <h2>`reversed` 倒序排名</h2>
    <ol reversed id="ranking">
      <li>第三名：Team C</li>
      <li>第二名：Team B</li>
      <li>第一名：Team A</li>
    </ol>
  </section>

  <section>
    <h2>`li[value]` 重设编号</h2>
    <ol id="jump-number">
      <li>正常编号</li>
      <li value="5">从 5 开始</li>
      <li>继续编号</li>
    </ol>
  </section>

  <h2>属性观察</h2>
  <pre id="result"></pre>

  <script>
    const continued = document.querySelector('#continued-steps');
    const ranking = document.querySelector('#ranking');
    const jumpItem = document.querySelector('#jump-number li[value]');

    document.querySelector('#result').textContent = [
      `continued.start = ${continued.start}`,
      `ranking.reversed = ${ranking.reversed}`,
      `jump li.value = ${jumpItem.value}`
    ].join('\n');
  </script>
</body>
</html>
