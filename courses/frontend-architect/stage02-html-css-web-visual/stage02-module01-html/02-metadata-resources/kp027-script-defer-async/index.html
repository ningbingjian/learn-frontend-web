<!doctype html>
<!--
  KP027：普通、defer、async
  核心：观察 defer 的顺序保证，以及 async 的独立执行特征。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>KP027：defer 与 async</title>
  <script>
    window.events = [];
    window.record = message => {
      events.push(message);
    };
  </script>
  <script src="./defer-a.js" defer></script>
  <script src="./defer-b.js" defer></script>
  <script src="./async-a.js" async></script>
  <script src="./async-b.js" async></script>
</head>
<body>
  <main id="content">
    <h1>defer 与 async 实验</h1>
    <p>刷新页面并观察事件顺序；可在 Network 面板开启限速。</p>
    <pre id="result">等待事件...</pre>
  </main>

  <script>
    const render = () => {
      document.querySelector('#result').textContent = events.join('\n');
    };

    record('body 尾部：解析器已到达正文末尾');
    render();

    document.addEventListener('DOMContentLoaded', () => {
      record('DOMContentLoaded');
      render();
    });

    window.addEventListener('load', () => {
      record('load');
      render();
    });
  </script>
</body>
</html>
