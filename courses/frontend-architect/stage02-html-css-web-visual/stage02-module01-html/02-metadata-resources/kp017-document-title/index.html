<!doctype html>
<!--
  KP017：title 文档标题
  核心：title 位于 head，描述整个文档。
  JavaScript 仅用于对照 title 与正文 h1。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>HTML 元信息学习 - Frontend Lab</title>
</head>
<body>
  <h1>HTML 元信息学习</h1>
  <p>观察浏览器标签页，再对照下面的诊断结果。</p>

  <pre id="result"></pre>

  <script>
    const heading = document.querySelector('h1').textContent;

    document.querySelector('#result').textContent = [
      'document.title：' + document.title,
      '页面 h1：' + heading
    ].join('\n');
  </script>
</body>
</html>
