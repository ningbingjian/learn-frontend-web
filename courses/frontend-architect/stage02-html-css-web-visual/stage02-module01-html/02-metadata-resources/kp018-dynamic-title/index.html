<!doctype html>
<!--
  KP018：动态标题
  核心：由当前路由和未读状态统一计算 document.title。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>数据看板 - Admin</title>
</head>
<body>
  <h1>动态标题实验</h1>

  <nav>
    <a href="#dashboard">数据看板</a>
    <a href="#orders">订单管理</a>
  </nav>

  <p>
    <button id="add" type="button">增加未读</button>
    <button id="clear" type="button">清空未读</button>
  </p>

  <pre id="result"></pre>

  <script>
    const routeTitles = {
      dashboard: '数据看板 - Admin',
      orders: '订单管理 - Admin'
    };
    let unread = 0;

    function getRoute() {
      return location.hash.slice(1) || 'dashboard';
    }

    function renderTitle() {
      const route = getRoute();
      const baseTitle = routeTitles[route] || 'Admin';
      document.title = unread > 0
        ? `(${unread}) ${baseTitle}`
        : baseTitle;

      document.querySelector('#result').textContent = [
        'route：' + route,
        'unread：' + unread,
        'document.title：' + document.title
      ].join('\n');
    }

    window.addEventListener('hashchange', renderTitle);
    document.querySelector('#add').addEventListener('click', () => {
      unread += 1;
      renderTitle();
    });
    document.querySelector('#clear').addEventListener('click', () => {
      unread = 0;
      renderTitle();
    });

    renderTitle();
  </script>
</body>
</html>
