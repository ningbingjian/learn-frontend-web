<!doctype html>
<!--
  KP024：theme-color
  核心：使用 media 为明暗主题声明不同的浏览器主题色候选。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>KP024：theme-color</title>
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <style>
    body {
      background: #f8fafc;
      color: #0f172a;
      font-family: system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0f172a;
        color: #f8fafc;
      }
    }
  </style>
</head>
<body>
  <h1>theme-color 实验</h1>
  <p>切换系统明暗模式后刷新页面，观察输出。</p>
  <pre id="result"></pre>

  <script>
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    const metas = [...document.querySelectorAll('meta[name="theme-color"]')];
    const selected = metas.find(meta => matchMedia(meta.media).matches);

    document.querySelector('#result').textContent = [
      '当前模式：' + (dark ? 'dark' : 'light'),
      '匹配主题色：' + (selected?.content || '(未找到)'),
      '候选数量：' + metas.length
    ].join('\n');
  </script>
</body>
</html>
