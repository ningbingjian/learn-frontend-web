<!doctype html>
<!--
  KP023：站点图标
  核心：使用 link rel="icon" 声明 favicon。
  JavaScript 仅用于读取最终解析结果。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>KP023：站点图标</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" sizes="any">
</head>
<body>
  <h1>站点图标实验</h1>
  <p>观察浏览器标签页图标，并核对下面的资源声明。</p>
  <pre id="result"></pre>

  <script>
    const icons = [...document.querySelectorAll('link[rel~="icon"]')];

    document.querySelector('#result').textContent = icons.map(icon => [
      'rel=' + icon.rel,
      'type=' + (icon.type || '(未声明)'),
      'sizes=' + (icon.sizes.value || '(未声明)'),
      'href=' + icon.href
    ].join(' | ')).join('\n');
  </script>
</body>
</html>
