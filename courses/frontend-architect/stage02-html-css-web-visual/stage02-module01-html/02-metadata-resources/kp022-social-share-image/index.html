<!doctype html>
<!--
  KP022：社交分享图片
  核心：og:image 使用公开可访问的绝对 URL。
  示例 URL 用于教学，不代表真实托管图片。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>HTML 元信息指南 - Frontend Lab</title>
  <meta property="og:title" content="HTML 元信息指南">
  <meta
    property="og:image"
    content="https://example.com/assets/share/html-metadata-card.jpg"
  >
  <meta
    property="og:image:alt"
    content="HTML 元信息指南分享卡片"
  >
</head>
<body>
  <h1>社交分享图片实验</h1>
  <pre id="result"></pre>

  <script>
    function getMeta(property) {
      return document.querySelector(
        `meta[property="${property}"]`
      )?.content || '(缺失)';
    }

    const image = getMeta('og:image');
    const isAbsolute = /^https?:\/\//.test(image);

    document.querySelector('#result').textContent = [
      'og:title：' + getMeta('og:title'),
      'og:image：' + image,
      'og:image:alt：' + getMeta('og:image:alt'),
      '绝对 URL：' + (isAbsolute ? '是' : '否')
    ].join('\n');
  </script>
</body>
</html>
