<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>国际化注册与结算表单</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.6 system-ui, sans-serif; color: #24282d; background: #f5f7fa; }
    main { max-width: 820px; margin: auto; padding: 2rem 1rem 4rem; }
    form, .summary { background: white; padding: 1.25rem; border-radius: .8rem; box-shadow: 0 1px 8px rgb(0 0 0 / .06); }
    fieldset { border: 1px solid #cfd6de; border-radius: .6rem; margin: 0 0 1rem; padding: 1rem; }
    legend { font-weight: 700; padding: 0 .4rem; }
    label { display: block; font-weight: 650; margin-top: .8rem; }
    input, select, textarea { width: 100%; padding: .65rem; margin-top: .25rem; font: inherit; border: 1px solid #87919c; border-radius: .4rem; }
    input[type="radio"], input[type="checkbox"] { width: auto; }
    .inline-label { display: inline; font-weight: 400; margin-right: 1rem; }
    .help { margin: .25rem 0; color: #5d6874; font-size: .92rem; }
    .error { margin: .25rem 0; color: #a21d2d; min-height: 1.4em; }
    [aria-invalid="true"] { border: 2px solid #a21d2d; }
    #error-summary { border: 2px solid #a21d2d; padding: 1rem; margin-bottom: 1rem; border-radius: .6rem; background: #fff7f8; }
    #server-status { padding: .8rem; margin-block: 1rem; border-radius: .5rem; background: #eef4ff; }
    button { padding: .7rem 1rem; font: inherit; font-weight: 700; }
    .rtl-example { background: #f3f0ff; padding: .7rem; border-radius: .4rem; }
    pre { white-space: pre-wrap; background: #111827; color: #e5e7eb; padding: 1rem; border-radius: .5rem; }
  </style>
</head>
<body>
<main>
  <h1>国际化注册与结算</h1>
  <p>所有数据仅用于本地教学演示，不会发送到真实服务器。</p>

  <div id="error-summary" hidden tabindex="-1" aria-labelledby="error-title">
    <h2 id="error-title">请修正以下问题</h2>
    <ul id="error-list"></ul>
  </div>

  <form id="checkout" novalidate>
    <fieldset>
      <legend>1. 联系信息</legend>
      <label for="name">姓名</label>
      <input id="name" name="name" autocomplete="name" minlength="2" required aria-describedby="name-help name-error">
      <p id="name-help" class="help">至少输入 2 个字符。</p>
      <p id="name-error" class="error"></p>

      <label for="email">电子邮箱</label>
      <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-help email-error">
      <p id="email-help" class="help">用于接收订单确认。测试服务端错误可输入 used@example.com。</p>
      <p id="email-error" class="error"></p>

      <label for="phone">手机号码</label>
      <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" pattern="[0-9]{11}" required aria-describedby="phone-help phone-error">
      <p id="phone-help" class="help">教学案例要求 11 位数字。</p>
      <p id="phone-error" class="error"></p>
    </fieldset>

    <fieldset>
      <legend>2. 配送地址</legend>
      <label for="country">国家或地区</label>
      <select id="country" name="country" required aria-describedby="country-error">
        <option value="">请选择</option>
        <option value="CN">中国大陆</option>
        <option value="SG">新加坡</option>
        <option value="AE">阿联酋</option>
      </select>
      <p id="country-error" class="error"></p>

      <label for="address">详细地址</label>
      <textarea id="address" name="address" rows="3" required aria-describedby="address-error"></textarea>
      <p id="address-error" class="error"></p>

      <label for="postal">邮政编码</label>
      <input id="postal" name="postal" inputmode="numeric" pattern="[0-9]{6}" required aria-describedby="postal-help postal-error">
      <p id="postal-help" class="help">本案例使用 6 位数字格式。</p>
      <p id="postal-error" class="error"></p>

      <p class="rtl-example" lang="ar" dir="rtl">مثال على عنوان الشحن: شارع الاتحاد، دبي</p>
    </fieldset>

    <fieldset>
      <legend>3. 支付与确认</legend>
      <p>收据格式：</p>
      <label class="inline-label"><input type="radio" name="receipt" value="electronic" checked> 电子收据</label>
      <label class="inline-label"><input type="radio" name="receipt" value="paper"> 纸质收据</label>

      <p><label class="inline-label"><input id="terms" name="terms" type="checkbox" value="accepted" required aria-describedby="terms-error"> 我已阅读并同意服务条款</label></p>
      <p id="terms-error" class="error"></p>
    </fieldset>

    <div id="server-status" role="status" aria-live="polite">尚未提交。</div>
    <button type="submit">提交结算信息</button>
  </form>

  <section class="summary" aria-labelledby="payload-title">
    <h2 id="payload-title">本地 FormData 预览</h2>
    <pre id="payload">尚无数据</pre>
  </section>
</main>
<script>
  const form = document.querySelector('#checkout');
  const summary = document.querySelector('#error-summary');
  const errorList = document.querySelector('#error-list');
  const serverStatus = document.querySelector('#server-status');
  const payload = document.querySelector('#payload');

  function messageFor(control) {
    const v = control.validity;
    if (v.valueMissing) return '这是必填项。';
    if (v.typeMismatch) return '请输入符合字段类型的值。';
    if (v.tooShort) return `至少输入 ${control.minLength} 个字符。`;
    if (v.patternMismatch) return '输入格式不符合要求。';
    return '请检查输入。';
  }

  function clearErrors() {
    summary.hidden = true;
    errorList.replaceChildren();
    for (const control of form.elements) {
      if (!control.id) continue;
      control.removeAttribute('aria-invalid');
      const error = document.querySelector(`#${control.id}-error`);
      if (error) error.textContent = '';
    }
  }

  function setFieldError(control, message) {
    control.setAttribute('aria-invalid', 'true');
    const error = document.querySelector(`#${control.id}-error`);
    if (error) error.textContent = message;
    const item = document.createElement('li');
    const link = document.createElement('a');
    link.href = `#${control.id}`;
    link.textContent = message;
    item.append(link);
    errorList.append(item);
  }

  form.addEventListener('input', event => {
    const control = event.target;
    if (!control.id) return;
    if (control.validity.valid) {
      control.removeAttribute('aria-invalid');
      const error = document.querySelector(`#${control.id}-error`);
      if (error) error.textContent = '';
    }
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    clearErrors();
    const invalid = [...form.elements].filter(control => control.willValidate && !control.validity.valid);
    if (invalid.length) {
      invalid.forEach(control => setFieldError(control, messageFor(control)));
      summary.hidden = false;
      summary.focus();
      invalid[0].focus();
      serverStatus.textContent = '前端约束校验未通过。';
      return;
    }

    const data = new FormData(form);
    payload.textContent = [...data.entries()].map(([k, v]) => `${k}: ${v}`).join('\n');
    serverStatus.textContent = '正在模拟服务端校验…';
    await new Promise(resolve => setTimeout(resolve, 500));

    if (data.get('email') === 'used@example.com') {
      const email = document.querySelector('#email');
      setFieldError(email, '这个邮箱已被注册，请更换邮箱。');
      summary.hidden = false;
      email.focus();
      serverStatus.textContent = '服务端返回字段错误（模拟 422）。';
      return;
    }
    if (String(data.get('name')).toLowerCase() === 'server') {
      serverStatus.textContent = '服务器暂时不可用（模拟 500）。请保留当前输入后重试。';
      return;
    }
    serverStatus.textContent = '提交成功（本地模拟）。服务端仍应执行最终业务校验。';
  });
</script>
</body>
</html>
