<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP057 - 绝对地址与相对地址</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.7; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .links { display: grid; gap: 12px; margin: 24px 0; }
    a { width: fit-content; }
    pre { padding: 16px; background: #f5f5f5; overflow: auto; }
  </style>
</head>
<body>
  <h1>绝对地址与相对地址</h1>
  <p>当前解析基准：<code id="base-uri"></code></p>

  <div class="links">
    <a id="absolute-link" data-demo href="https://example.com/docs/url?mode=full#parts">
      绝对 URL 示例
    </a>
    <a id="relative-link" data-demo href="./index.html?source=relative#demo">
      相对 URL 示例
    </a>
  </div>

  <h2>解析结果</h2>
  <pre id="result"></pre>

  <script>
    document.querySelector('#base-uri').textContent = document.baseURI;

    const links = document.querySelectorAll('a[data-demo]');
    const lines = [...links].flatMap((link) => [
      link.textContent.trim(),
      `raw href: ${link.getAttribute('href')}`,
      `resolved href: ${link.href}`,
      ''
    ]);

    document.querySelector('#result').textContent = lines.join('\n');
  </script>
</body>
</html>
