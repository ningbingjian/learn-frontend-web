<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP064 - rel 接收页</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 32px; line-height: 1.7; }
    pre { padding: 14px; background: #f6f8fa; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>rel 接收页</h1>
  <p>此页用于观察来源信息与 opener 关系。</p>
  <pre id="result"></pre>

  <script>
    const params = new URLSearchParams(location.search);

    document.querySelector('#result').textContent = [
      `case：${params.get('case') || '(none)'}`,
      `document.referrer：${document.referrer || '(empty)'}`,
      `window.opener 是否存在：${Boolean(window.opener)}`,
      `window.name：${window.name || '(empty)'}`
    ].join('\n');
  </script>
</body>
</html>
