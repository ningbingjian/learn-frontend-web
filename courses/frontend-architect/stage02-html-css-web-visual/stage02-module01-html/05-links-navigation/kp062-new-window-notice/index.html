<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP062 - 新窗口提示</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.7; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .links { display: grid; gap: 14px; margin: 24px 0; }
    a { width: fit-content; }
    .bad { padding: 12px; border: 1px dashed #999; }
    pre { padding: 16px; background: #f5f5f5; overflow: auto; }
  </style>
</head>
<body>
  <h1>新窗口提示</h1>

  <div class="links">
    <a data-demo href="#normal-target">
      查看本页说明
    </a>

    <a data-demo href="https://example.com/report" target="_blank" rel="noopener">
      查看示例年度报告（在新窗口打开）
    </a>

    <div class="bad">
      <strong>教学反例：</strong>
      <a data-demo href="https://example.com/help" target="_blank" rel="noopener">
        打开帮助中心
      </a>
    </div>
  </div>

  <section id="normal-target">
    <h2>本页说明</h2>
    <p>普通链接保持当前浏览上下文。新窗口链接应在点击前告知行为变化。</p>
  </section>

  <h2>链接行为摘要</h2>
  <pre id="result"></pre>

  <script>
    const links = [...document.querySelectorAll('a[data-demo]')];
    const lines = links.map((link) => {
      const text = link.textContent.trim();
      const target = link.getAttribute('target') ?? '_self';
      const hasNotice = /新窗口|新标签/.test(text);
      return `${text} | target=${target} | visible notice=${hasNotice}`;
    });

    document.querySelector('#result').textContent = lines.join('\n');
  </script>
</body>
</html>
