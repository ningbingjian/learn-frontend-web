<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP060 - mailto tel download</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.7; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .links { display: grid; gap: 12px; margin: 24px 0; }
    a { width: fit-content; }
    pre { padding: 16px; background: #f5f5f5; overflow: auto; }
  </style>
</head>
<body>
  <h1>协议与下载链接</h1>

  <div class="links">
    <a data-demo href="mailto:hello@example.com?subject=HTML%20%E8%AF%BE%E7%A8%8B%E5%92%A8%E8%AF%A2&body=%E4%BD%A0%E5%A5%BD%EF%BC%8C%E6%88%91%E6%83%B3%E4%BA%86%E8%A7%A3%E8%AF%BE%E7%A8%8B%E3%80%82">
      发送课程咨询邮件
    </a>

    <a data-demo href="tel:+15551234567">
      拨打示例电话：+1 (555) 123-4567
    </a>

    <a data-demo href="./sample.txt" download="frontend-link-notes.txt">
      下载学习笔记
    </a>
  </div>

  <h2>链接元数据</h2>
  <pre id="result"></pre>

  <script>
    const lines = [...document.querySelectorAll('a[data-demo]')].flatMap((link) => [
      link.textContent.trim(),
      `raw href: ${link.getAttribute('href')}`,
      `protocol: ${new URL(link.href).protocol}`,
      `download: ${link.getAttribute('download') ?? '(none)'}`,
      ''
    ]);

    document.querySelector('#result').textContent = lines.join('\n');
  </script>
</body>
</html>
