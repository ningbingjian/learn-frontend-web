<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP059 - 页面片段导航</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.7; max-width: 900px; margin: 0 auto; padding: 24px 20px 80px; }
    nav { position: sticky; top: 0; padding: 12px 0; background: white; display: flex; gap: 16px; border-bottom: 1px solid #ddd; }
    section { min-height: 70vh; padding-top: 32px; scroll-margin-top: 70px; }
    pre { padding: 16px; background: #f5f5f5; overflow: auto; }
  </style>
</head>
<body>
  <h1>页面片段导航</h1>

  <nav aria-label="页面目录">
    <a href="#overview">概览</a>
    <a href="#install">安装</a>
    <a href="#faq">常见问题</a>
  </nav>

  <section id="overview">
    <h2>概览</h2>
    <p>点击上方目录，观察 URL 中的 fragment 和页面滚动。</p>
  </section>

  <section id="install">
    <h2>安装</h2>
    <p>片段导航会定位到对应 id。滚动位置和键盘焦点需要分别观察。</p>
  </section>

  <section id="faq">
    <h2>常见问题</h2>
    <p>连续切换片段后，可以使用浏览器后退与前进验证历史记录。</p>
  </section>

  <h2>当前状态</h2>
  <pre id="result"></pre>

  <h2>URL 编码示例</h2>
  <pre id="encoding"></pre>

  <script>
    function renderState() {
      document.querySelector('#result').textContent = [
        `location.hash: ${location.hash || '(empty)'}`,
        `activeElement: ${document.activeElement.tagName.toLowerCase()}`,
        `activeElement id: ${document.activeElement.id || '(none)'}`
      ].join('\n');
    }

    window.addEventListener('hashchange', renderState);
    document.addEventListener('focusin', renderState);
    renderState();

    const source = '安装指南';
    document.querySelector('#encoding').textContent = [
      `source: ${source}`,
      `encoded: ${encodeURIComponent(source)}`
    ].join('\n');
  </script>
</body>
</html>
