<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP063 - target 属性</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 880px; margin: 40px auto; padding: 0 20px; line-height: 1.7; }
    section { margin: 28px 0; padding: 20px; border: 1px solid #d0d7de; border-radius: 12px; }
    a { margin-right: 14px; }
    iframe { width: 100%; min-height: 180px; border: 1px solid #8c959f; border-radius: 8px; margin-top: 12px; }
    pre { padding: 14px; overflow: auto; background: #f6f8fa; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>target 浏览上下文实验</h1>
  <p>同一个目标页面，通过不同的 <code>target</code> 可以进入不同浏览上下文。</p>

  <section>
    <h2>1. 当前上下文与新上下文</h2>
    <p>
      <a data-demo href="./target-page.html?mode=self" target="_self">当前页打开（_self）</a>
      <a data-demo href="./target-page.html?mode=blank" target="_blank" rel="noopener">新上下文打开（_blank）</a>
    </p>
    <p>点击 <code>_self</code> 后，可使用浏览器后退返回本实验页。</p>
  </section>

  <section>
    <h2>2. 命名浏览上下文复用</h2>
    <p>
      <a data-demo href="./target-page.html?report=first" target="reportWindow">打开报表 A</a>
      <a data-demo href="./target-page.html?report=second" target="reportWindow">打开报表 B</a>
    </p>
    <p>两个链接都使用 <code>target="reportWindow"</code>，第二次通常会复用同名窗口 / 标签页。</p>
  </section>

  <section>
    <h2>3. 定向到 iframe</h2>
    <p>
      <a data-demo href="./target-page.html?frame=preview" target="previewFrame">加载到下方 iframe</a>
    </p>
    <iframe
      name="previewFrame"
      title="链接预览区域"
      srcdoc="<p style='font-family:system-ui,sans-serif;padding:16px'>等待 target 链接加载内容…</p>"
    ></iframe>
  </section>

  <section>
    <h2>实验辅助：链接 target 列表</h2>
    <pre id="links"></pre>
  </section>

  <script>
    const rows = [...document.querySelectorAll('a[data-demo]')].map(link =>
      `${link.textContent.trim()} → target=${link.target || '(默认 _self)'}`
    );

    document.querySelector('#links').textContent = rows.join('\n');
  </script>
</body>
</html>
