<!doctype html>
<!--
  KP010：乱码诊断

  同一组 UTF-8 字节：
  - 用 UTF-8 解码，得到原始中文。
  - 用 Windows-1252 解码，得到典型乱码。

  诊断顺序：
  1. 原始字符是什么？
  2. 实际字节是什么？
  3. 使用什么编码解码？
  4. 第一次错误发生在哪一层？
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>KP010：乱码诊断</title>
</head>
<body>
  <h1>同一组字节，不同解码结果</h1>

  <pre id="result"></pre>

  <script>
    const original = '中文';
    const bytes = new TextEncoder().encode(original);

    const correct =
      new TextDecoder('utf-8').decode(bytes);

    const wrong =
      new TextDecoder('windows-1252').decode(bytes);

    const hex = Array.from(
      bytes,
      value => value.toString(16).padStart(2, '0')
    ).join(' ');

    document.querySelector('#result').textContent = [
      '原始字符：' + original,
      '实际字节：' + hex,
      'UTF-8 解码：' + correct,
      'Windows-1252 解码：' + wrong,
      '',
      '结论：字节没有变化，错误发生在解码方式。'
    ].join('\n');
  </script>
</body>
</html>
