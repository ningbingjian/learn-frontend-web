<!doctype html>
<!--
  KP014：initial-scale 初始缩放
  核心：width=device-width, initial-scale=1。
  不通过 user-scalable=no 或 maximum-scale=1 禁止用户缩放。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KP014：initial-scale 初始缩放</title>
</head>
<body>
  <h1>初始缩放实验</h1>
  <p>建议在真实移动设备上尝试双指缩放并观察数据。</p>

  <pre id="result"></pre>

  <script>
    function render() {
      const viewport = window.visualViewport;

      document.querySelector('#result').textContent = [
        'devicePixelRatio = ' + window.devicePixelRatio,
        'visualViewport.scale = ' + (viewport ? viewport.scale : '不支持'),
        'visualViewport.width = ' + (viewport ? viewport.width.toFixed(2) : '不支持')
      ].join('\n');
    }

    render();
    window.visualViewport?.addEventListener('resize', render);
  </script>
</body>
</html>
