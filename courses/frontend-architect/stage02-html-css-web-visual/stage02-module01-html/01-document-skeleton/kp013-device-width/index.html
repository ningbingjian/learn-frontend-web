<!doctype html>
<!--
  KP013：viewport 与设备宽度
  核心：width=device-width。
  JavaScript 仅用于读取当前浏览环境的宽度数据。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>KP013：viewport 与设备宽度</title>
</head>
<body>
  <h1>设备宽度实验</h1>
  <p>请打开 DevTools 的 Device Toolbar，然后改变模拟设备宽度。</p>

  <pre id="result"></pre>

  <script>
    function render() {
      document.querySelector('#result').textContent = [
        'window.innerWidth = ' + window.innerWidth,
        'documentElement.clientWidth = ' + document.documentElement.clientWidth,
        'screen.width = ' + screen.width,
        'devicePixelRatio = ' + window.devicePixelRatio
      ].join('\n');
    }

    render();
    window.addEventListener('resize', render);
  </script>
</body>
</html>
