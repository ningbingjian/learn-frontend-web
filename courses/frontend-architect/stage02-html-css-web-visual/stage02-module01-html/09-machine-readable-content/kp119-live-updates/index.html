<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP119 - live region 动态宣布</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; line-height: 1.7; }
    section { margin: 24px 0; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
    button { margin: 4px; padding: 8px 14px; }
    .status { min-height: 1.8em; padding: 8px; background: #f5f5f5; border-radius: 6px; }
    #urgent-message { min-height: 1.8em; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>KP119：动态宣布实验</h1>

    <section>
      <h2>普通搜索状态</h2>
      <button id="search-button" type="button">模拟搜索</button>
      <p id="search-status" class="status" role="status"></p>
    </section>

    <section>
      <h2>保存状态</h2>
      <button id="save-button" type="button">保存草稿</button>
      <p id="save-status" class="status" aria-live="polite" aria-atomic="true"></p>
    </section>

    <section>
      <h2>紧急消息对照</h2>
      <button id="error-button" type="button">模拟严重错误</button>
      <p id="urgent-message" role="alert"></p>
    </section>
  </main>

  <script>
    const searchStatus = document.querySelector('#search-status');
    const saveStatus = document.querySelector('#save-status');
    const urgentMessage = document.querySelector('#urgent-message');
    let searchCount = 0;

    document.querySelector('#search-button').addEventListener('click', () => {
      searchCount += 1;
      searchStatus.textContent = `第 ${searchCount} 次搜索完成，已找到 ${searchCount * 6} 条结果。`;
    });

    document.querySelector('#save-button').addEventListener('click', () => {
      saveStatus.textContent = `草稿已保存，时间 ${new Date().toLocaleTimeString()}`;
    });

    document.querySelector('#error-button').addEventListener('click', () => {
      urgentMessage.textContent = '支付连接失败，请立即检查网络后重试。';
    });
  </script>
</body>
</html>
