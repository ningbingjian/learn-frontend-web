<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP115 - s 与 del</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; line-height: 1.7; }
    section { padding: 20px; margin: 24px 0; border: 1px solid #ccc; border-radius: 10px; }
    s { background: #fff1b8; }
    del { background: #ffe2e2; }
    ins { background: #e2f8e7; }
    pre { background: #f5f5f5; padding: 14px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>KP115：s 与 del 选择边界</h1>

  <section>
    <h2>价格变化：内容不再准确</h2>
    <p>原价：<s id="old-price">¥299</s>，现价：<strong>¥199</strong></p>
  </section>

  <section>
    <h2>条款变更：文档修订</h2>
    <p>
      售后条款：
      <del id="old-rule">7 天无理由退货</del>
      <ins>14 天无理由退货</ins>
    </p>
  </section>

  <section>
    <h2>DOM 验证</h2>
    <pre id="result"></pre>
  </section>

  <script>
    const oldPrice = document.querySelector('#old-price');
    const oldRule = document.querySelector('#old-rule');
    document.querySelector('#result').textContent =
      `原价标签: ${oldPrice.tagName}\n旧条款标签: ${oldRule.tagName}`;
  </script>
</body>
</html>
