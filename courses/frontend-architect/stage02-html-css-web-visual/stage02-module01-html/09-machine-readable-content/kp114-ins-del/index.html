<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP114 - ins 与 del</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; line-height: 1.7; }
    section { margin: 24px 0; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
    del { background: #ffe2e2; }
    ins { background: #e2f8e7; }
    pre { background: #f5f5f5; padding: 14px; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>KP114：文档修订实验</h1>

  <section>
    <h2>会议时间调整</h2>
    <p>
      开始时间：
      <del id="old-time" datetime="2026-08-30T19:20:00+08:00" cite="./change-note.html">19:00</del>
      <ins id="new-time" datetime="2026-08-30T19:20:00+08:00" cite="./change-note.html">20:00</ins>
    </p>
    <p>修改原因：发布会议延后 1 小时。</p>
  </section>

  <section>
    <h2>DOM 观察</h2>
    <pre id="result"></pre>
  </section>

  <script>
    const lines = [...document.querySelectorAll('del, ins')].map((change) => {
      return `${change.tagName}: ${change.textContent.trim()}\n  datetime=${change.dateTime}\n  cite=${change.cite}`;
    });
    document.querySelector('#result').textContent = lines.join('\n\n');
  </script>
</body>
</html>
