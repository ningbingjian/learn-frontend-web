<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP118 - output</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; line-height: 1.7; }
    form, section { margin: 24px 0; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
    label { display: block; margin: 12px 0; }
    input { padding: 6px; }
    output { display: inline-block; font-weight: 800; min-width: 100px; }
    pre { background: #f5f5f5; padding: 14px; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>KP118：output 元素实验</h1>

  <form id="order-form">
    <label>单价：<input id="price" name="price" type="number" min="0" step="0.1" value="19.9"></label>
    <label>数量：<input id="quantity" name="quantity" type="number" min="1" step="1" value="2"></label>
    <p>总价：<output id="total" name="total" for="price quantity">¥39.80</output></p>
    <button type="submit">检查 FormData</button>
    <button type="reset">重置</button>
  </form>

  <section>
    <h2>行为观察</h2>
    <pre id="result"></pre>
  </section>

  <script>
    const form = document.querySelector('#order-form');
    const price = document.querySelector('#price');
    const quantity = document.querySelector('#quantity');
    const total = document.querySelector('#total');
    const result = document.querySelector('#result');

    function updateTotal() {
      const priceValue = Number.isFinite(price.valueAsNumber) ? price.valueAsNumber : 0;
      const quantityValue = Number.isFinite(quantity.valueAsNumber) ? quantity.valueAsNumber : 0;
      total.value = `¥${(priceValue * quantityValue).toFixed(2)}`;
    }

    function renderFormData() {
      const data = new FormData(form);
      const entries = [...data.entries()].map(([key, value]) => `${key}=${value}`);
      result.textContent = [
        `form.elements.total === output: ${form.elements.total === total}`,
        `FormData.has('total'): ${data.has('total')}`,
        `FormData: ${entries.join(', ')}`,
      ].join('\n');
    }

    form.addEventListener('input', updateTotal);
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      renderFormData();
    });
    form.addEventListener('reset', () => {
      requestAnimationFrame(() => {
        updateTotal();
        renderFormData();
      });
    });

    updateTotal();
    renderFormData();
  </script>
</body>
</html>
