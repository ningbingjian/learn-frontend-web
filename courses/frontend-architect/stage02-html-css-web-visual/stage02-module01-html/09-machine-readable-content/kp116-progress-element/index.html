<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP116 - progress</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; line-height: 1.7; }
    section { margin: 24px 0; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
    progress { width: min(100%, 420px); height: 24px; display: block; margin: 8px 0 16px; }
    button { padding: 8px 14px; }
    pre { background: #f5f5f5; padding: 14px; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>KP116：progress 元素实验</h1>

  <section>
    <label for="upload-progress">文件上传进度</label>
    <progress id="upload-progress" value="35" max="100">35%</progress>
    <button id="advance" type="button">增加 10</button>
  </section>

  <section>
    <label for="background-progress">后台索引状态</label>
    <progress id="background-progress">处理中</progress>
  </section>

  <section>
    <h2>DOM 观察</h2>
    <pre id="result"></pre>
  </section>

  <script>
    const upload = document.querySelector('#upload-progress');
    const background = document.querySelector('#background-progress');
    const result = document.querySelector('#result');

    function render() {
      result.textContent = [
        `upload: value=${upload.value}, max=${upload.max}, position=${upload.position}`,
        `background: has value attr=${background.hasAttribute('value')}, position=${background.position}`,
      ].join('\n');
    }

    document.querySelector('#advance').addEventListener('click', () => {
      upload.value = Math.min(upload.value + 10, upload.max);
      upload.textContent = `${upload.value}%`;
      render();
    });

    render();
  </script>
</body>
</html>
