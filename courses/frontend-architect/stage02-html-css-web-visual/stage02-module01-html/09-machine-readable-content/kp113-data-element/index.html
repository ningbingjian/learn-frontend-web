<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP113 - data 元素</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; line-height: 1.7; }
    section { padding: 20px; border: 1px solid #ccc; border-radius: 10px; margin: 24px 0; }
    data { font-weight: 700; }
    pre { background: #f5f5f5; padding: 14px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>KP113：data 元素实验</h1>

  <section>
    <p>商品：<data id="product" value="SKU-2026-001">城市通勤背包</data></p>
    <p>套餐：<data id="plan" value="plan_pro">专业版</data></p>
    <p>订单状态：<data id="status" value="paid">已支付</data></p>
  </section>

  <section>
    <h2>显示文本与机器值</h2>
    <pre id="result"></pre>
  </section>

  <script>
    const lines = [...document.querySelectorAll('data')].map((item) => {
      return `${item.id}: 展示=${item.textContent.trim()} | value=${item.value}`;
    });
    document.querySelector('#result').textContent = lines.join('\n');
  </script>
</body>
</html>
