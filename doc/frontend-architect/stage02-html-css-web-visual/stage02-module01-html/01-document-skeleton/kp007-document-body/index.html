<!doctype html>
<!--
  KP007：body 与页面主体

  一个 HTML Document 只有一个 body。
  body 内部可以继续包含 header、main、footer 和多个应用挂载节点。
  子应用不应该再生成新的 body。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>KP007：body 页面主体</title>
</head>
<body>
  <header>
    <p>站点名称</p>
  </header>

  <main>
    <h1>订单管理</h1>

    <div id="order-app">
      订单应用挂载点
    </div>

    <div id="help-app">
      帮助应用挂载点
    </div>
  </main>

  <footer>
    <p>版权信息</p>
  </footer>

  <h2>当前文档结构</h2>
  <pre id="result"></pre>

  <script>
    const directChildren = Array.from(
      document.body.children,
      element => element.tagName.toLowerCase()
    );

    document.querySelector('#result').textContent = [
      'body 数量：' + document.querySelectorAll('body').length,
      'main 数量：' + document.querySelectorAll('main').length,
      'body 直接子元素：' + directChildren.join(', ')
    ].join('\n');
  </script>
</body>
</html>
